<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#211F1C">
<title>Climb Diary</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
  :root{
    --stone-50:#EFEDE6;
    --stone-100:#E4E0D4;
    --stone-300:#D6D0C2;
    --stone-500:#A69E8A;
    --ink-900:#211F1C;
    --ink-700:#3A362F;
    --moss-600:#55684A;
    --moss-100:#E1E6D9;
    --rust-600:#A8461F;
    --rust-100:#F2E1D6;
    --slate-500:#3E5B68;
    --slate-100:#DCE6E8;
    --ochre-600:#B8801F;
    --plum-600:#6B4A73;
    --teal-600:#2F7A6B;
    --paper:#FAF9F5;
    --radius:20px;
    --shadow:0 4px 20px rgba(0,0,0,0.06);
    font-size:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;overscroll-behavior-y:none;}
  body{
    background:#F0E8D6;
    color:var(--ink-900);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overscroll-behavior-y:none;
    padding-bottom:calc(72px + env(safe-area-inset-bottom));
  }
  .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;}
  .display{
    font-family:"Arial Narrow",-apple-system,"Segoe UI",sans-serif;
    font-weight:800;
    letter-spacing:-0.01em;
    text-transform:uppercase;
  }
  /* background texture: faint contour lines */
  .contour-bg{
    background-image:repeating-linear-gradient(115deg, rgba(33,31,28,0.035) 0px, rgba(33,31,28,0.035) 1px, transparent 1px, transparent 26px);
  }

  #appSplash{
    position:fixed; inset:0; z-index:100;
    background:linear-gradient(160deg, #3E4A3F 0%, #1B241D 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    transition:opacity 0.5s ease, visibility 0.5s ease;
  }
  #appSplash.hide{opacity:0; visibility:hidden; pointer-events:none;}
  #appSplash img{animation:splashPulse 1.8s ease-in-out infinite;}
  .splash-title{
    color:#F6EFDA; font-weight:800; font-size:1.1rem; letter-spacing:0.02em;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  .splash-brand{
    position:absolute; left:0; right:0; bottom:calc(36px + env(safe-area-inset-bottom));
    text-align:center; color:rgba(246,239,218,0.6); font-size:0.68rem; font-weight:700;
    letter-spacing:0.3em; font-family:'Futura','Century Gothic','Trebuchet MS',Avenir,sans-serif;
  }
  @keyframes splashPulse{
    0%,100%{transform:scale(1); opacity:1;}
    50%{transform:scale(1.08); opacity:0.85;}
  }

  header.topbar{
    position:relative; z-index:20; overflow:hidden;
    background:linear-gradient(180deg, #7C8B93 0%, #A9B3AE 38%, #C7CBB8 60%, #E4DFC9 100%);
    color:var(--paper);
    padding-top:env(safe-area-inset-top);
  }
  header.topbar::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(10,14,12,0.08) 0%, rgba(10,14,12,0.22) 45%, rgba(10,14,12,0.8) 100%);
    pointer-events:none;
  }
  header.topbar .hero-scene{position:absolute; left:0; bottom:0; width:100%; height:100%; display:block;}
  header.topbar .topbar-row{
    position:relative; z-index:2; display:flex; align-items:center; justify-content:space-between;
    padding:9px 14px 0;
  }
  header.topbar .back-btn{
    background:rgba(0,0,0,0.28);border:none;color:var(--paper);
    width:40px;height:40px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer; padding:0;
  }
  header.topbar .back-btn:active{background:rgba(0,0,0,0.4);}
  header.topbar .hero-brand{display:flex; align-items:center; gap:7px;}
  header.topbar .top-icon{width:17px;height:17px;flex-shrink:0;color:var(--paper);display:block;transform:translateY(-1px);}
  header.topbar .hero-brand span{font-size:0.86rem; font-weight:700; line-height:1;}
  header.topbar .hero-avatar{
    width:26px;height:26px;border-radius:50%; background:rgba(255,255,255,0.18);
    border:1.5px solid rgba(255,255,255,0.5); display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:0.6rem; font-weight:700; backdrop-filter:blur(4px);
  }
  header.topbar .hero-level-badge{
    background:rgba(0,0,0,0.32); color:#fff; font-size:0.62rem; font-weight:800;
    padding:3px 8px; border-radius:10px; backdrop-filter:blur(4px); white-space:nowrap;
  }
  header.topbar .topbar-bottom{
    position:relative; z-index:2; padding:5px 16px 10px;
    display:flex; align-items:center; gap:10px;
  }
  header.topbar .topbar-title-wrap{flex:1; min-width:0;}
  header.topbar .header-guide-pill{
    flex-shrink:0; display:inline-flex; align-items:center; gap:5px; background:rgba(255,255,255,0.16);
    color:#fff; border:1px solid rgba(255,255,255,0.4); border-radius:20px; padding:7px 12px;
    font-size:0.7rem; font-weight:700; cursor:pointer; white-space:nowrap;
  }
  header.topbar .header-guide-pill.set{background:var(--moss-600); border-color:transparent;}
  header.topbar .eyebrow{
    margin:0 0 1px; font-size:0.54rem; font-weight:700; letter-spacing:0.14em; text-transform:uppercase;
    color:rgba(255,255,255,0.7);
  }
  header.topbar h1{
    font-size:1.18rem; margin:0; font-weight:800; letter-spacing:-0.01em;
    display:flex; flex-direction:column; gap:1px;
  }
  header.topbar h1 small{
    font-size:0.7rem; font-weight:500; color:rgba(255,255,255,0.88); text-transform:none; letter-spacing:0;
    white-space:pre-line; line-height:1.35;
  }
  header.topbar .top-action{
    background:rgba(255,255,255,0.1); border:none; color:var(--paper);
    width:36px;height:36px;border-radius:10px; font-size:18px; cursor:pointer;
  }

  main{padding:14px 14px 90px; position:relative;}
  .topo-bg{position:fixed; inset:0; width:100vw; height:100vh; z-index:-1; pointer-events:none; display:block;}
  .section-title{
    font-size:0.72rem; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--ink-700); font-weight:700; margin:18px 4px 8px;
  }

  .grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px;}
  .card{
    background:var(--paper);
    border-radius:var(--radius);
    padding:14px;
    box-shadow:var(--shadow);
    border:1px solid var(--stone-300);
    cursor:pointer;
    position:relative;
    transition:transform .12s ease;
  }
  .card:active{transform:scale(0.97);}
  .card h3{margin:0 0 6px; font-size:1.02rem; font-weight:800;}
  .card .meta-row, .meta-row{display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:8px;}
  .pill{
    font-size:0.68rem; font-weight:700; padding:3px 8px; border-radius:20px;
    display:inline-flex; align-items:center; gap:4px;
  }
  .pill.todo{background:var(--rust-100); color:var(--rust-600);}
  .pill.done{background:var(--moss-100); color:var(--moss-600);}
  .pill.tag{background:var(--stone-100); color:var(--ink-700);}
  .pill.tag.favorite{background:#FBEFD2; color:#9A6B1E;}
  .pill.tag.perceived{background:var(--slate-100); color:var(--slate-500);}
  .chip-grid{display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 4px;}
  .chip-choice{
    padding:7px 12px; border-radius:20px; border:1px solid var(--stone-300);
    background:var(--stone-50); font-size:0.8rem; font-weight:600; cursor:pointer; color:var(--ink-700);
  }
  .chip-choice.selected{background:var(--ink-900); color:var(--paper); border-color:var(--ink-900);}
  .chip-choice.chip-add{background:none; border-style:dashed; color:var(--stone-500);}
  .color-swatch-row{display:flex; gap:10px; margin:6px 0 4px;}
  .color-swatch{
    width:32px; height:32px; border-radius:50%; border:2.5px solid transparent; cursor:pointer; padding:0;
  }
  .color-swatch.selected{border-color:var(--ink-900);}
  .custom-chip-row{display:flex; gap:8px; align-items:center; margin-top:2px;}
  .coord-input-row{display:flex; gap:8px; align-items:center;}
  .block-coords-details{margin-top:14px; margin-bottom:20px;}
  .block-coords-details summary{
    display:inline-flex; align-items:center; gap:7px; font-size:0.8rem; font-weight:700; color:var(--ink-900);
    cursor:pointer; list-style:none; background:var(--stone-100); border:1px solid var(--stone-300);
    padding:8px 14px; border-radius:20px;
  }
  .block-coords-details summary::-webkit-details-marker{display:none;}
  .block-coords-details[open] summary{background:var(--ink-900); color:var(--paper); border-color:var(--ink-900);}
  .block-coords-details[open] summary .guide-plus{background:var(--paper); color:var(--ink-900);}
  .coord-input-row input{flex:1;}
  .coord-sign-btn{
    width:40px; height:40px; flex-shrink:0; border-radius:12px; border:1px solid var(--stone-300);
    background:var(--stone-50); color:var(--ink-900); font-size:1.1rem; font-weight:800; cursor:pointer;
  }
  .custom-chip-row .custom-chip-input{flex:1; margin-top:0;}
  .chip-confirm-btn{
    width:36px; height:36px; flex-shrink:0; border-radius:50%; border:none;
    background:var(--moss-600); color:#fff; font-size:1rem; font-weight:800; cursor:pointer;
  }

  .grade-wheel-wrap{position:relative; height:132px; overflow:hidden; border-radius:12px; background:var(--stone-50); border:1px solid var(--stone-300); margin:6px 0 4px;}
  .grade-wheel{
    height:132px; overflow-y:scroll; scroll-snap-type:y mandatory; -webkit-overflow-scrolling:touch;
    padding:47px 0; scrollbar-width:none;
  }
  .grade-wheel::-webkit-scrollbar{display:none;}
  .grade-wheel-row{
    height:38px; display:flex; align-items:center; justify-content:center; scroll-snap-align:center;
    font-size:1.05rem; font-weight:700; color:var(--stone-500); transition:color .1s, font-size .1s;
  }
  .grade-wheel-row.active{color:var(--ink-900) !important; font-size:1.35rem;}
  .grade-wheel-highlight{
    position:absolute; top:50%; left:8px; right:8px; height:38px; margin-top:-19px;
    border-top:2px solid var(--moss-600); border-bottom:2px solid var(--moss-600);
    pointer-events:none; background:rgba(85,104,74,0.06); border-radius:8px;
  }
  .card-menu-btn{
    position:absolute; top:8px; right:8px; background:none; border:none;
    font-size:18px; color:var(--stone-500); padding:4px 8px; cursor:pointer; z-index:2;
  }
  .loc-card .card-menu-btn{color:rgba(255,255,255,0.9); text-shadow:0 1px 3px rgba(0,0,0,0.35);}
  .card.loc-card{
    overflow:hidden; padding:12px;
  }
  .zone-thumb{
    width:100%; height:64px; border-radius:14px; margin-bottom:10px; overflow:hidden; position:relative;
  }
  .zone-thumb svg{width:100%; height:100%; display:block;}
  .zone-thumb.sector-thumb{height:48px;}
  .sec-badge{
    width:30px; height:30px; border-radius:9px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; margin-bottom:8px;
    background:var(--accent, var(--ink-900)); color:#fff; font-size:0.8rem;
  }

  .sector-list{display:flex; flex-direction:column; gap:8px;}
  .sector-row{
    position:relative; background:var(--paper); border:1px solid var(--stone-300);
    border-radius:14px; overflow:hidden; box-shadow:var(--shadow); cursor:pointer;
  }
  .sector-row-mountain-bg{position:absolute; inset:0; z-index:0; pointer-events:none;}
  .sector-row-mountain-bg svg{width:100%; height:100%; display:block;}
  .sector-row-content{position:relative; z-index:1; display:flex; align-items:center; gap:14px; padding:13px 16px;}
  .sector-row-body{flex:1; min-width:0;}
  .sector-row-body h3{margin:0 0 3px; font-size:0.98rem;}
  .sector-row-stats{display:flex; gap:5px; align-items:center; margin-top:3px; flex-wrap:wrap;}
  .sector-row-stats.sector-row-empty{font-size:0.74rem; color:var(--stone-500); display:block;}
  .pill.discarded-pill{background:var(--stone-300); color:var(--ink-900);}
  .sector-row-monogram-wrap{position:relative; flex-shrink:0;}
  .sector-row-monogram{
    width:38px; height:38px; border-radius:11px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    color:var(--paper); font-weight:800; font-size:0.85rem;
  }
  .sector-pin-badge{
    position:absolute; bottom:-4px; right:-4px; font-size:0.85rem; line-height:1;
  }
  .sector-book-badge{
    position:absolute; top:-4px; right:-4px; font-size:0.85rem; line-height:1;
  }
  .sector-row-chevron{font-size:1.15rem; color:var(--stone-500); flex-shrink:0; margin-right:2px;}
  .sector-row-menu{position:static; padding:12px 12px; flex-shrink:0; align-self:center;}
  .list-item{
    background:var(--paper); border:1px solid var(--stone-300); border-radius:var(--radius);
    padding:12px; margin-bottom:10px; box-shadow:var(--shadow); position:relative;
  }
  .list-item.priority-super-bg{background:#FBEFD2;}
  .list-item.priority-radar-bg{background:var(--slate-100);}
  .list-item.priority-discarded-bg{background:var(--stone-100);}
  .list-item.priority-normal-flat{box-shadow:none;}
  .entry-item-dated{display:flex; align-items:flex-start; gap:14px;}
  .entry-item-dated .upcoming-body{min-width:0; flex:1;}
  .list-item.expanded{background:var(--paper) !important;}
  .card-corner{
    position:absolute; top:2px; right:2px; z-index:2;
    display:flex; flex-direction:column; align-items:flex-end; gap:4px;
  }
  .card-header-wrap{position:relative;}
  .card-header-wrap.discarded-fade{opacity:0.6;}
  .done-date{
    font-size:0.68rem; color:var(--stone-500); white-space:nowrap;
  }
  .rating-under-name{margin-top:3px;}
  .favorite-star{font-size:0.95rem; line-height:1; color:#E3B04B; margin-left:5px; vertical-align:middle;}
  .badge{
    width:40px;height:40px;border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:0.72rem; font-weight:800; color:#fff; flex-shrink:0;
  }
  .badge.todo{background:var(--rust-600);}
  .badge.done{background:var(--moss-600);}
  .badge.grade-green{background:var(--moss-600);}
  .badge.grade-yellow{background:var(--ochre-600);}
  .badge.grade-blue{background:var(--slate-500);}
  .badge.grade-red{background:var(--rust-600);}
  .badge.grade-black{background:var(--ink-900);}
  .badge.grade-purple{background:var(--plum-600);}
  .block-row{display:flex; gap:12px; align-items:flex-start;}
  .block-row .block-info{flex:1; min-width:0; padding-right:44px;}
  .block-row .block-info .bname{font-weight:700; font-size:1rem;}
  .block-row .block-info .bsub{font-size:0.82rem; color:var(--ink-700); margin-top:2px;}
  .block-row .block-info .bsub.bsub-truncate{
    font-size:0.72rem; color:var(--stone-500); overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; max-width:80%; display:block;
  }
  .rock-type-label{font-size:0.72rem; color:var(--stone-500); font-weight:600;}
  .stars{display:flex; gap:2px; margin-top:4px;}
  .stars .star{font-size:1.05rem; color:var(--stone-300); cursor:pointer;}
  .stars .star.on{color:#C98A2C;}
  .rating-stars-10{display:flex; align-items:center; gap:3px; margin-top:6px; flex-wrap:wrap;}
  .star10{font-size:1.35rem; line-height:1; color:var(--stone-300); cursor:pointer; flex-shrink:0;}
  .star10.on{color:#C98A2C;}
  .rating-stars-10 .rnum{font-size:0.78rem; font-weight:700; color:var(--ink-700); margin-left:6px; white-space:nowrap;}
  .rating-badge{
    display:inline-flex; align-items:center; gap:2px; font-size:0.68rem; font-weight:800;
    padding:3px 8px; border-radius:20px; white-space:nowrap;
  }
  .rating-badge.r-red{background:var(--rust-100); color:var(--rust-600);}
  .rating-badge.r-yellow{background:#FBEFD2; color:var(--ochre-600);}
  .rating-badge.r-green{background:var(--moss-100); color:var(--moss-600);}
  .rating-badge.r-blue{background:var(--slate-100); color:var(--slate-500);}
  .super-project-badge{
    display:inline-flex; align-items:center; gap:4px; font-size:0.64rem; font-weight:800; color:#9A6B1E;
    background:#FBEFD2; padding:3px 8px; border-radius:20px; white-space:nowrap;
  }
  .radar-badge{
    display:inline-flex; align-items:center; gap:4px; font-size:0.64rem; font-weight:800; color:var(--slate-500);
    background:var(--slate-100); padding:3px 8px; border-radius:20px; white-space:nowrap;
  }
  .discarded-badge{
    display:inline-flex; align-items:center; gap:4px; font-size:0.64rem; font-weight:800; color:var(--stone-500);
    background:var(--stone-100); padding:3px 8px; border-radius:20px; white-space:nowrap;
  }
  .btn-priority-active-super{background:#FBEFD2 !important; color:#9A6B1E !important;}
  .btn-priority-active-radar{background:var(--slate-100) !important; color:var(--slate-500) !important;}
  .btn-priority-active-discarded{background:var(--stone-300) !important; color:var(--ink-900) !important;}
  .btn-priority-active-normal{background:var(--stone-300) !important; color:var(--ink-900) !important;}
  .btn.btn-xs{padding:8px 11px; font-size:0.76rem; border-radius:9px;}
  .btn-row-2rows{gap:6px; row-gap:6px;}
  .proyecto-plain-label{font-size:0.68rem; font-weight:800; color:var(--ink-900); white-space:nowrap;}
  .block-detail-rows{margin-bottom:12px;}
  .block-detail-row{
    display:flex; justify-content:space-between; gap:10px; padding:6px 0;
    border-bottom:1px solid var(--stone-100); font-size:0.82rem;
  }
  .block-detail-row:first-child{padding-top:0;}
  .block-detail-label{color:var(--stone-500); flex-shrink:0;}
  .block-detail-value{color:var(--ink-900); font-weight:600; text-align:right;}
  .review-box{
    margin-top:6px; font-size:0.8rem; color:var(--stone-500); font-style:italic;
  }
  .review-line{
    margin-bottom:10px; font-size:0.85rem; color:var(--ink-900);
  }
  .review-line strong{color:var(--ink-900);}
  .comment-box{
    margin-top:8px; font-size:0.85rem; color:var(--ink-700);
    background:var(--stone-100); border-radius:10px; padding:8px 10px;
  }
  .session-notes-list{margin:2px 0; padding-left:18px;}
  .session-notes-list li{font-size:0.85rem; color:var(--ink-700); margin-bottom:2px;}
  .session-notes-line{font-size:0.85rem; color:var(--ink-700); margin-bottom:2px;}
  .finger-grade-eq{font-size:0.76rem; color:var(--moss-600); font-weight:700; margin-top:6px; display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .finger-level-tag{
    font-size:0.62rem; font-weight:800; background:var(--moss-100); color:var(--moss-600);
    padding:2px 7px; border-radius:20px;
  }
  .suggestion-card{border:1.5px dashed var(--rust-600); background:var(--rust-100);}
  .calc-result{margin-top:14px; padding-top:14px; border-top:1px dashed var(--stone-300); text-align:center;}
  .calc-ratio-badge{font-size:2rem; font-weight:800; color:var(--ink-900);}
  .calc-total-txt{font-size:0.78rem; color:var(--ink-700); margin-top:2px;}
  .calc-grade-tags{font-size:0.85rem; font-weight:700; color:var(--moss-600); margin-top:8px; display:flex; align-items:center; justify-content:center; gap:6px; flex-wrap:wrap;}
  .botiquin-disclaimer{background:#FBEFD2; color:#8A6A0A; font-size:0.8rem; line-height:1.4; font-weight:600;}
  .botiquin-section .botiquin-title{font-weight:800; font-size:0.9rem; margin-bottom:6px;}
  .botiquin-section .botiquin-body{font-size:0.85rem; line-height:1.5; color:var(--ink-700);}
  .suggestion-title{font-weight:800; font-size:0.85rem; margin-bottom:4px;}
  .suggestion-text{font-size:0.82rem; color:var(--ink-700); margin-top:2px;}
  .block-expand{margin-top:10px; display:none; border-top:1px dashed var(--stone-300); padding-top:10px;}
  .block-expand.open{display:block;}

  .photos-hint{font-size:0.76rem; color:var(--ink-700); margin:4px 0 2px; line-height:1.4;}
  .block-photos{display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 4px;}
  .photo-thumb{
    width:60px; height:60px; border-radius:10px; overflow:hidden; cursor:pointer;
    background:var(--stone-100); border:1px solid var(--stone-300); flex-shrink:0;
  }
  .photo-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .photo-thumb-editable{

    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .upcoming-desc.muted{color:var(--stone-500); font-style:italic;}
  .upcoming-arrow{font-size:1.4rem; color:var(--stone-500); flex-shrink:0;}

  .search-bar{position:relative; margin:6px 4px 14px;}
  .search-bar input{
    width:100%; padding:10px 14px 10px 38px; border-radius:14px; border:1px solid var(--stone-300);
    background:var(--paper); font-size:0.9rem; color:var(--ink-900); box-shadow:var(--shadow);
  }
  .search-bar input::placeholder{color:var(--stone-500);}
  .search-bar .search-icon{
    position:absolute; left:13px; top:50%; transform:translateY(-50%); pointer-events:none;
    display:flex; color:var(--stone-500);
  }
  .search-bar.mini{display:none; margin:0 4px 12px;}
  .search-bar.mini.open{display:block;}
  .section-title-row{display:flex; align-items:center; justify-content:space-between; margin:18px 4px 8px; gap:8px;}
  .section-title-row .section-title{margin:0;}
  .icon-btn-search{
    background:none; border:none; width:24px; height:24px; padding:0;
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; color:var(--stone-500);
  }
  .icon-btn-search:active{color:var(--ink-900);}
  .icon-btn-search.active{color:var(--rust-600);}
  .search-filter-row{display:flex; align-items:center; gap:10px; margin:12px 4px 14px;}
  .search-filter-row .icon-btn-search{
    width:38px; height:38px; border-radius:14px; background:var(--paper); border:1px solid var(--stone-300);
    box-shadow:var(--shadow); flex-shrink:0;
  }
  .search-filter-row .icon-btn-search.active{color:var(--rust-600); border-color:var(--rust-600);}
  .grade-range-row{display:flex; justify-content:space-between; align-items:baseline; font-size:0.85rem; color:var(--ink-700);}
  .grade-range-row strong{color:var(--ink-900); font-family:var(--font-mono,monospace);}
  input[type=range]{width:100%; accent-color:var(--rust-600);}
  .upcoming-edit-btn{
    flex-shrink:0; width:32px; height:32px; border-radius:50%; border:none;
    background:var(--stone-100); color:var(--ink-900); font-size:14px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0;
  }
  .upcoming-card.is-today .upcoming-edit-btn{background:rgba(255,255,255,0.7);}
  .upcoming-title.finished{text-decoration:line-through; color:var(--stone-500);}
  .upcoming-card.is-finished{opacity:0.7;}
  .upcoming-feeling{font-size:1.3rem; flex-shrink:0; margin-right:2px;}
  .finished-tag{
    font-size:0.6rem; font-weight:800; background:var(--moss-600); color:#fff;
    padding:2px 6px; border-radius:8px; vertical-align:middle; text-decoration:none; display:inline-block;
  }

  .session-viewer .sv-top{display:flex; align-items:center; justify-content:space-between;}
  .session-viewer .sv-date{font-size:0.72rem; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--slate-500);}
  .session-viewer .sv-edit-btn{
    background:var(--stone-100); border:none; width:34px; height:34px; border-radius:10px;
    font-size:15px; cursor:pointer; color:var(--ink-900); flex-shrink:0;
  }
  .session-viewer .sv-desc{
    font-size:1rem; line-height:1.6; color:var(--ink-900); white-space:pre-wrap;
    margin-top:6px; padding-top:12px; border-top:1px solid var(--stone-300);
  }
  .session-viewer .sv-desc.muted{color:var(--stone-500); font-style:italic; font-size:0.9rem;}
  .sv-feeling-tag{
    display:inline-flex; align-items:center; gap:5px; font-size:0.78rem; font-weight:700;
    background:var(--stone-100); padding:5px 10px; border-radius:20px; margin-top:10px;
  }

  .profile-card{
    background:linear-gradient(135deg, var(--ink-900), #3A362F);
    color:var(--paper); border-radius:var(--radius); padding:18px; margin-bottom:6px;
    display:flex; align-items:center; gap:14px;
  }
  .profile-avatar{
    width:52px;height:52px;border-radius:50%; background:rgba(255,255,255,0.14);
    display:flex; align-items:center; justify-content:center; font-size:1.3rem; font-weight:800; flex-shrink:0;
    overflow:hidden;
  }
  .profile-card .pname{font-size:1.1rem; font-weight:800;}
  .profile-card .psub{font-size:0.75rem; color:var(--stone-300); margin-top:2px;}
  .profile-edit-btn{margin-left:auto; background:rgba(255,255,255,0.14); border:none; color:var(--paper); width:32px;height:32px;border-radius:9px; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center;}

  .photo-picker-row{display:flex; align-items:center; gap:14px; margin:6px 0 4px;}
  .photo-picker-preview{
    width:60px; height:60px; border-radius:50%; background:var(--stone-100); color:var(--ink-700);
    display:flex; align-items:center; justify-content:center; font-size:1.1rem; font-weight:800;
    overflow:hidden; flex-shrink:0; border:1px solid var(--stone-300);
  }
  .photo-picker-preview img{width:100%; height:100%; object-fit:cover;}

  .goals-list{display:flex; flex-direction:column;}
  .goal-row{display:flex; align-items:center; gap:10px; padding:11px 2px;}
  .goal-row + .goal-row{border-top:1px solid var(--stone-100);}
  .goal-check{
    width:22px; height:22px; border-radius:50%; border:2px solid var(--stone-300); flex-shrink:0;
    background:none; cursor:pointer; display:flex; align-items:center; justify-content:center;
    font-size:0.7rem; font-weight:800; color:#fff; padding:0;
  }
  .goal-check.done{background:var(--moss-600); border-color:var(--moss-600);}
  .goal-text{flex:1; font-size:0.9rem; color:var(--ink-900);}
  .goal-text.done{text-decoration:line-through; color:var(--stone-500);}
  .goal-remove{background:none; border:none; color:var(--stone-500); font-size:1.1rem; cursor:pointer; padding:2px 6px; flex-shrink:0;}

  /* ---- Capa social ---- */
  /* ---- Visor de PDF integrado (croquis/guías) ---- */
  .pdf-viewer-overlay{
    position:fixed; inset:0; z-index:250; background:#161616; display:none; flex-direction:column;
  }
  .pdf-viewer-overlay.open{display:flex;}
  .pdf-viewer-topbar{
    background:#1E1E1E; padding:calc(10px + env(safe-area-inset-top)) 10px 10px;
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  .pdf-viewer-topbar button{
    background:rgba(255,255,255,0.12); border:none; color:#fff; width:34px; height:34px; border-radius:9px;
    font-size:16px; cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  }
  .pdf-viewer-title{
    color:#fff; font-size:0.8rem; font-weight:700; flex:1; min-width:60px; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap;
  }
  .pdf-viewer-page-jump{display:flex; align-items:center; gap:5px; flex-shrink:0;}
  .pdf-viewer-page-jump input{
    width:52px; padding:7px 6px; border-radius:8px; border:none; background:rgba(255,255,255,0.14);
    color:#fff; font-size:0.8rem; text-align:center;
  }
  .pdf-viewer-page-jump button{
    width:auto; padding:0 10px; font-size:0.72rem; font-weight:700;
  }
  .pdf-viewer-overlay iframe{flex:1; border:none; width:100%; background:#fff;}
  .pdf-viewer-hint{color:rgba(255,255,255,0.5); font-size:0.62rem; text-align:center; padding:4px 0 8px; background:#1E1E1E;}

  .grade-row{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
  .grade-row .glabel{width:44px; flex-shrink:0; font-size:0.8rem; text-align:right;}
  .grade-row .glabel.glabel-style{width:80px; font-family:inherit;}
  .grade-row .gbar-wrap{flex:1; background:var(--stone-100); border-radius:6px; height:16px; overflow:hidden;}
  .grade-row .gbar{height:100%; background:var(--moss-600); border-radius:6px;}
  .grade-row .gcount{width:22px; flex-shrink:0; font-size:0.78rem; font-weight:700; text-align:left;}

  .toast{
    position:fixed; bottom:calc(90px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
    background:var(--ink-900); color:var(--paper); padding:10px 18px; border-radius:30px;
    font-size:0.85rem; z-index:50; opacity:0; pointer-events:none; transition:opacity .25s ease;
  }
  .toast.show{opacity:1;}

  @media (prefers-reduced-motion:reduce){
    *{transition:none !important; animation:none !important;}
  }
</style>
</head>

<script>
(function(){
"use strict";

/* ---------------------------------------------------------- */
/* IndexedDB layer                                             */
/* ---------------------------------------------------------- */
const DB_NAME = "cuaderno_roca";
const DB_VERSION = 3;
let dbp = null;

function openDB(){
  if(dbp) return dbp;
  dbp = new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e)=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains("locations")) db.createObjectStore("locations",{keyPath:"id"});
      if(!db.objectStoreNames.contains("sectors")) db.createObjectStore("sectors",{keyPath:"id"});
      if(!db.objectStoreNames.contains("blocks")) db.createObjectStore("blocks",{keyPath:"id"});
      if(!db.objectStoreNames.contains("routes")) db.createObjectStore("routes",{keyPath:"id"});
      if(!db.objectStoreNames.contains("pdfs")) db.createObjectStore("pdfs",{keyPath:"id"});
      if(!db.objectStoreNames.contains("training_days")) db.createObjectStore("training_days",{keyPath:"id"});
      if(!db.objectStoreNames.contains("training_logs")) db.createObjectStore("training_logs",{keyPath:"id"});
      if(!db.objectStoreNames.contains("meta")) db.createObjectStore("meta",{keyPath:"id"});
    };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
  return dbp;
}

async function tx(storeName, mode, fn){
  const db = await openDB();
  return new Promise((resolve,reject)=>{
    const t = db.transaction(storeName, mode);
    const store = t.objectStore(storeName);
    const result = fn(store);
    t.oncomplete = ()=>resolve(result);
    t.onerror = ()=>reject(t.error);
  });
}

function reqToPromise(req){
  return new Promise((res,rej)=>{ req.onsuccess=()=>res(req.result); req.onerror=()=>rej(req.error); });
}

async function dbGetAll(store){
  const db = await openDB();
  return reqToPromise(db.transaction(store,"readonly").objectStore(store).getAll());
}
async function dbGet(store,id){
  const db = await openDB();
  return reqToPromise(db.transaction(store,"readonly").objectStore(store).get(id));
}
async function dbPut(store,obj){
  const db = await openDB();
  const t = db.transaction(store,"readwrite");
  t.objectStore(store).put(obj);
  return new Promise((res,rej)=>{ t.oncomplete=()=>res(obj); t.onerror=()=>rej(t.error); });
}
async function dbDelete(store,id){
  const db = await openDB();
  const t = db.transaction(store,"readwrite");
  t.objectStore(store).delete(id);
  return new Promise((res,rej)=>{ t.oncomplete=()=>res(true); t.onerror=()=>rej(t.error); });
}

function uid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "id-"+Date.now()+"-"+Math.random().toString(16).slice(2);
}

/* ---------------------------------------------------------- */
/* App state / router                                          */
/* ---------------------------------------------------------- */
const state = {
  tab: "sectores",
  sectStack: [], // navigation stack for sectores tab: [] = locations, [{loc}], [{loc},{sector}]
  blockFilter: "todo", // 'todo' | 'done' within a sector
  climbMode: "boulder", // 'boulder' | 'route'
  pdfLocationFilter: "all",
  trainingMonth: (()=>{ const d=new Date(); d.setDate(1); d.setHours(0,0,0,0); return d; })(),
  sectorSearchOpen: false, sectorSearchTerm: "", // lupita en la vista de sectores dentro de una zona
  itemSearchTerm: "", // búsqueda de bloques/vías dentro de un sector
  itemSortMode: "recent", // 'recent' | 'best' | 'worst' | 'grade_asc' | 'grade_desc' dentro de un sector
  itemStyleFilter: new Set(), // filtro de estilos (Placa, Techo, etc.) dentro de un sector
  itemGradeMin: null, itemGradeMax: null, // rango de grado (strings) dentro de un sector

function displayGrade(grade){

  const g = grade.trim();
  const isVNotation = /^V\d+$/i.test(g) || g.toUpperCase()==="VB";
  const wantVScale = cachedSettings.gradeSystem==="vscale";
  if(wantVScale && !isVNotation){
    const match = GRADE_CONVERSION.find(row=>row.font.toLowerCase()===g.toLowerCase());

  } else if(!wantVScale && isVNotation){

function gradeRankToColorClass(rank){
  if(rank<36) return "grade-green";
  if(rank<=38) return "grade-yellow";
  if(rank<=41) return "grade-blue";
  if(rank<=44) return "grade-red";
  if(rank<=47) return "grade-purple";

function gradeRank(grade){
  if(!grade) return null;
  const gUpper = grade.trim().toUpperCase();
  if(VSCALE_APPROX_RANK.hasOwnProperty(gUpper)) return VSCALE_APPROX_RANK[gUpper];
  const m = grade.trim().toLowerCase().match(/^(\d+)([abc])?(\+)?$/);
  if(!m) return null;
  const num = parseInt(m[1],10);
  const letter = m[2];
  const plus = !!m[3];
  if(!letter) return (num-3)*6 + (plus?3:0);
  const letterBase = {a:0,b:2,c:4}[letter];
  const subIndex = letterBase + (plus?1:0);
  return num*6 + subIndex;
}

  const rank = gradeRank(grade);
  if(rank===null) return "";
  return gradeRankToColorClass(rank);

const GRADE_WHEEL_ROW_H = 38;
function buildGradeWheelHTML(id, grades, selected){
  return `<div class="grade-wheel-wrap">

      ${grades.map(g=>`<div class="grade-wheel-row" data-grade="${escapeAttr(g)}">${escapeHtml(g)}</div>`).join("")}

function wireGradeWheel(id, grades, initialGrade, onChange){
  const el = document.getElementById(id);
  if(!el) return;
  const rowH = GRADE_WHEEL_ROW_H;
  let currentIdx = Math.max(0, grades.indexOf(initialGrade));

  function paint(idx){
    el.querySelectorAll(".grade-wheel-row").forEach((r,i)=>r.classList.toggle("active", i===idx));
  }
  function scrollToIdx(idx, smooth){
    el.scrollTo({top: idx*rowH, behavior: smooth?"smooth":"auto"});
  }
  function commit(idx, vibrate){
    idx = Math.max(0, Math.min(grades.length-1, idx));
    currentIdx = idx;
    paint(idx);
    onChange(grades[idx]);
    if(vibrate && navigator.vibrate) navigator.vibrate(8);
  }

  requestAnimationFrame(()=>{ scrollToIdx(currentIdx, false); paint(currentIdx); });

  // While the finger is moving we only repaint the highlighted row —
  // we never fight the scroll with our own scrollTo, that's what caused the jitter.
  let scrollTimer, lastLiveIdx = currentIdx;
  el.addEventListener("scroll", ()=>{
    const idx = Math.max(0, Math.min(grades.length-1, Math.round(el.scrollTop/rowH)));
    if(idx !== lastLiveIdx){
      lastLiveIdx = idx;
      paint(idx);
      if(navigator.vibrate) navigator.vibrate(5);
      playGradeTick();
    }
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(()=>{
      const finalIdx = Math.max(0, Math.min(grades.length-1, Math.round(el.scrollTop/rowH)));
      commit(finalIdx);
    }, 140);
  });

  el.querySelectorAll(".grade-wheel-row").forEach((r,i)=>{
    r.addEventListener("click",()=>{ scrollToIdx(i, true); commit(i, true); });
  });
}

/* ---- Ilustración de sector: línea de vía tipo topo, determinista por nombre ---- */
function mulberrySeed(seed){
  let a = seed;
  return function(){
    a |= 0; a = (a+0x6D2B79F5)|0;
    let t = Math.imul(a ^ a>>>15, 1 | a);
    t = (t + Math.imul(t ^ t>>>7, 61 | t)) ^ t;
    return ((t ^ t>>>14) >>> 0) / 4294967296;
  };
}
function sectorLineArtSVG(name){
  let h = 0;
  for(let i=0;i<name.length;i++) h = (h*37 + name.charCodeAt(i)) >>> 0;
  const accent = ACCENT_PALETTE[h % ACCENT_PALETTE.length];
  const rand = mulberrySeed(h);
  let x = 18 + rand()*10, y = 56;
  const pts = [[x,y]];
  for(let i=0;i<4;i++){
    x += (rand()-0.3)*26;
    x = Math.max(8, Math.min(78, x));
    y -= 9 + rand()*8;
    pts.push([x,y]);
  }
  const path = pts.map(p=>p.join(",")).join(" ");
  const [tipX,tipY] = pts[pts.length-1];
  return `<svg class="zone-art" viewBox="0 0 100 60" preserveAspectRatio="xMidYMid slice">

}

/* ---- Fondo topográfico: curvas de nivel anidadas y orgánicas ---- */
function seededRandom(seed){
  let s = seed % 2147483647;
  if(s <= 0) s += 2147483646;
  return function(){ s = (s*16807) % 2147483647; return (s-1)/2147483646; };
}
function midpoint(a,b){ return [(a[0]+b[0])/2, (a[1]+b[1])/2]; }
function smoothClosedPath(pts){
  const n = pts.length;
  const start = midpoint(pts[n-1], pts[0]);
  let d = `M ${start[0].toFixed(1)},${start[1].toFixed(1)} `;
  for(let i=0;i<n;i++){
    const p = pts[i];
    const next = pts[(i+1)%n];
    const m = midpoint(p, next);
    d += `Q ${p[0].toFixed(1)},${p[1].toFixed(1)} ${m[0].toFixed(1)},${m[1].toFixed(1)} `;
  }
  return d + "Z";
}
function hillContours(cx, cy, baseRadius, ringCount, seed){
  const rand = seededRandom(seed);
  const pointCount = 10 + Math.floor(rand()*4);
  const radiusFactors = [];
  for(let i=0;i<pointCount;i++) radiusFactors.push(0.6 + rand()*0.85);
  const paths = [];
  for(let r=0;r<ringCount;r++){
    const t = r/(ringCount-1);
    const scale = Math.pow(1-t, 1.15);
    if(scale < 0.04) continue;
    const pts = [];
    for(let i=0;i<pointCount;i++){
      const angle = (i/pointCount) * Math.PI*2;
      const jitter = 1 + (rand()-0.5)*0.22;
      const rad = baseRadius * scale * radiusFactors[i] * jitter;
      pts.push([cx + Math.cos(angle)*rad, cy + Math.sin(angle)*rad*0.82]);
    }
    paths.push(smoothClosedPath(pts));
  }
  return paths;
}

}

function openInMaps(lat, lng){
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  const webUrl = `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
  if(isIOS){
    const clickedAt = Date.now();
    window.location.href = `comgooglemaps://?q=${lat},${lng}&zoom=16`;
    setTimeout(()=>{
      if(Date.now() - clickedAt < 1800 && document.visibilityState==="visible"){
        window.location.href = webUrl;
      }
    }, 900);
  } else {
    const clickedAt = Date.now();
    window.location.href = `geo:${lat},${lng}?q=${lat},${lng}`;
    setTimeout(()=>{
      if(Date.now() - clickedAt < 1800 && document.visibilityState==="visible"){
        window.location.href = webUrl;
      }
    }, 900);
  }
}
document.addEventListener("click",(e)=>{
  const btn = e.target.closest("[data-open-maps-lat]");
  if(!btn) return;
  e.preventDefault();
  e.stopPropagation();
  const lat = parseFloat(btn.dataset.openMapsLat);
  const lng = parseFloat(btn.dataset.openMapsLng);
  if(!isNaN(lat) && !isNaN(lng)) openInMaps(lat, lng);
}, true);
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._h);
  toast._h = setTimeout(()=>t.classList.remove("show"), 1800);
}

  sheetBackdrop.classList.add("open");

}

(function(){
  let startY = null, currentY = null, dragging = false;
  function onStart(e){
    const rect = sheetContent.getBoundingClientRect();
    const touchY = e.touches[0].clientY;
    if(touchY - rect.top > 70) return;
    startY = touchY;
    currentY = startY;
    dragging = true;
    sheetContent.style.transition = "none";
  }
  function onMove(e){
    if(!dragging) return;
    currentY = e.touches[0].clientY;
    const delta = currentY - startY;
    if(delta > 0){
      e.preventDefault();
      sheetContent.style.transform = `translateY(${delta}px)`;
    }
  }
  function onEnd(){
    if(!dragging) return;
    dragging = false;
    sheetContent.style.transition = "";
    const delta = (currentY!=null ? currentY : startY) - startY;
    sheetContent.style.transform = "";
    if(delta > 70){
      closeSheet();
    }
    startY = null; currentY = null;
  }
  sheetContent.addEventListener("touchstart", onStart, {passive:true});
  sheetContent.addEventListener("touchmove", onMove, {passive:false});
  sheetContent.addEventListener("touchend", onEnd);
  sheetContent.addEventListener("touchcancel", onEnd);
})();

async function renderSectores(){
  const depth = state.sectStack.length;
  if(depth === 0) return renderLocationsView();
  if(depth >= 1){
    const freshLoc = await dbGet("locations", state.sectStack[0].id);
    if(freshLoc) state.sectStack[0] = freshLoc;
  }
  if(depth === 1) return renderSectorsView(state.sectStack[0]);
  if(depth >= 2){
    const freshSec = await dbGet("sectors", state.sectStack[1].id);
    if(freshSec) state.sectStack[1] = freshSec;
  }
  return state.climbMode==="route"
    ? renderRoutesView(state.sectStack[0], state.sectStack[1])
    : renderBlocksView(state.sectStack[0], state.sectStack[1]);
}

async function renderLocationsView(){
  const profile = await dbGet("meta","profile");
  cachedProfileName = profile ? profile.name : "";
  refreshProfilePhotoUrl(profile);
  setHeader(t("header_registro"), profile ? t("hola",profile.name) : t("header_diario_sub"), false);
  fabBtn.style.display = "flex";
  fabBtn.onclick = ()=>openLocationForm();

  const itemStore = state.climbMode==="route" ? "routes" : "blocks";
  const [allLocations, sectors, items] = await Promise.all([dbGetAll("locations"), dbGetAll("sectors"), dbGetAll(itemStore)]);
  const locations = allLocations.filter(l=>(l.climbType||"boulder")===state.climbMode);
  locations.sort((a,b)=>(a.order||0)-(b.order||0));

  let html = "";

  html += `<div class="tabs-row" id="climbModeRow">
    <button data-mode="boulder" class="${state.climbMode==="boulder"?"active":""}">${t("modo_boulder")}</button>
    <button data-mode="route" class="${state.climbMode==="route"?"active":""}">${t("modo_via")}</button>
  </div>`;

  const totalTodo = items.filter(b=>b.status==="todo").length;
  const totalDone = items.filter(b=>b.status==="done").length;
  html += `<div class="stat-grid">
    <div class="stat-chip-sm"><div class="num">${locations.length}</div><div class="lbl">${t("stat_zonas")}</div></div>
    <div class="stat-chip-sm"><div class="num">${sectors.length}</div><div class="lbl">${t("stat_sectores")}</div></div>
    <div class="stat-chip-sm"><div class="num">${totalDone}</div><div class="lbl">${t("stat_hechos")}</div></div>

  </div>`;

  html += `<div class="section-title">${t("sec_zonas_escalada")}</div>`;

  if(locations.length === 0){
    html += emptyState("🗻", t("empty_zonas_t"), t("empty_zonas_s"));
  } else {
    html += `<div class="grid">`;
    for(const loc of locations){
      const secOfLoc = sectors.filter(s=>s.locationId===loc.id && (s.climbType||"boulder")===state.climbMode);
      const secIds = new Set(secOfLoc.map(s=>s.id));
      const itemsOfLoc = items.filter(b=>secIds.has(b.sectorId));
      const todo = itemsOfLoc.filter(b=>b.status==="todo").length;
      const done = itemsOfLoc.filter(b=>b.status==="done").length;
      const accent = accentFor(loc.name);
      html += `<div class="card loc-card" style="--accent:${accent}" data-loc="${loc.id}">
        <button class="card-menu-btn" data-menu-loc="${loc.id}">⋯</button>
        <div class="zone-thumb">${zoneArtSVG(loc.name)}</div>
        <h3>${escapeHtml(loc.name)}</h3>

          ${todo>0?`<span class="pill todo">⏳ ${todo}</span>`:""}
          ${done>0?`<span class="pill done">✓ ${done}</span>`:""}
        </div>
      </div>`;
    }
    html += `</div>`;
  }

  mainArea.innerHTML = html;

  mainArea.querySelectorAll("[data-mode]").forEach(el=>{
    el.addEventListener("click",()=>{
      state.climbMode = el.dataset.mode;
      render();
    });
  });

  mainArea.querySelectorAll("[data-loc]").forEach(el=>{
    el.addEventListener("click",(e)=>{
      if(e.target.closest("[data-menu-loc]")) return;
      const loc = locations.find(l=>l.id===el.dataset.loc);
      state.sectStack = [loc];
      state.sectorSearchOpen = false;
      state.sectorSearchTerm = "";
      render();
    });
  });
  mainArea.querySelectorAll("[data-menu-loc]").forEach(el=>{
    el.addEventListener("click",(e)=>{
      e.stopPropagation();
      const loc = locations.find(l=>l.id===el.dataset.menuLoc);
      openLocationMenu(loc);
    });
  });
}

  const secOfLoc = sectors.filter(s=>s.locationId===loc.id && (s.climbType||"boulder")===state.climbMode).sort((a,b)=>(a.order||0)-(b.order||0));

  let html = `<div class="section-title">${t("sectores_en",escapeHtml(loc.name))}</div>`;
  html += `<div class="search-bar" style="margin:8px 4px 14px;"><span class="search-icon">${searchIconSVG(14)}</span><input type="search" id="secSearchInput" placeholder="${t("buscar_sector_placeholder")}" value="${escapeAttr(state.sectorSearchTerm)}"></div>`;
  html += `<div id="secBodyArea"></div>`;
  mainArea.innerHTML = html;

  const bodyEl = document.getElementById("secBodyArea");

  function filteredSecs(){
    const term = state.sectorSearchTerm.trim().toLowerCase();
    if(!term) return secOfLoc;
    return secOfLoc.filter(sec=>sec.name.toLowerCase().includes(term));
  }

  function renderSecBody(){
    const list = filteredSecs();
    let bodyHtml = "";
    if(list.length===0){
      bodyHtml = state.sectorSearchTerm.trim()
        ? emptyState("🔍", t("busqueda_sin_resultados_t"), t("busqueda_sin_resultados_s"))
        : emptyState("🧗", t("empty_sectores_t"), t("empty_sectores_s",escapeHtml(loc.name)));
    } else {
      bodyHtml += `<div class="sector-list">`;
      for(const sec of list){
        const b = items.filter(x=>x.sectorId===sec.id);
        const done = b.filter(x=>x.status==="done").length;
        const discarded = b.filter(x=>x.status==="todo" && getPriority(x)==="discarded").length;
        const todo = b.filter(x=>x.status==="todo").length - discarded;
        const { accent, initials } = sectorInitialsData(sec.name);
        const statPills = [
          todo>0?`<span class="pill todo">⏳ ${todo}</span>`:"",
          done>0?`<span class="pill done">✓ ${done}</span>`:"",
        ].join("");
        const statsHtml = statPills ? `<div class="sector-row-stats">${statPills}</div>` : `<div class="sector-row-stats sector-row-empty">${t("vacio")}</div>`;
        bodyHtml += `<div class="sector-row" data-sec="${sec.id}">
          <div class="sector-row-mountain-bg">${sectorRowMountainSVG(sec.name, accent)}</div>
          <div class="sector-row-content">
            <div class="sector-row-monogram-wrap">
              <div class="sector-row-monogram" style="background:${accent};">${escapeHtml(initials)}</div>
              ${sec.lat!=null ? `<span class="sector-pin-badge">🅿️</span>` : (sec.zoneLat!=null ? `<span class="sector-pin-badge">📍</span>` : "")}
              ${(sec.guide && sec.guide.blob) ? `<span class="sector-book-badge">📖</span>` : ""}
            </div>
            <div class="sector-row-body">
              <h3>${escapeHtml(sec.name)}</h3>
              ${statsHtml}
            </div>
            <div class="sector-row-chevron">›</div>
            <button class="card-menu-btn sector-row-menu" data-menu-sec="${sec.id}">⋯</button>
          </div>
        </div>`;
      }
      bodyHtml += `</div>`;
    }
    bodyEl.innerHTML = bodyHtml;

    bodyEl.querySelectorAll("[data-sec]").forEach(el=>{
      el.addEventListener("click",(e)=>{
        if(e.target.closest("[data-menu-sec]")) return;
        const sec = secOfLoc.find(s=>s.id===el.dataset.sec);
        state.sectStack = [loc, sec];
        state.blockFilter = "todo";
        state.itemSearchTerm = ""; state.itemSortMode = "recent"; state.itemStyleFilter = new Set(); state.itemGradeMin = null; state.itemGradeMax = null;
        render();
      });
    });
    bodyEl.querySelectorAll("[data-menu-sec]").forEach(el=>{
      el.addEventListener("click",(e)=>{
        e.stopPropagation();
        const sec = secOfLoc.find(s=>s.id===el.dataset.menuSec);
        openSectorMenu(sec);
      });
    });
  }

  renderSecBody();

  document.getElementById("secSearchInput").addEventListener("input",(e)=>{
    state.sectorSearchTerm = e.target.value;
    renderSecBody();
  });
}

function openSectorForm(loc, existing){

    <label class="field-label">${t("sec_form_name")}</label>

  `,(root)=>{
    // autofocus quitado (evita el bug de doble toque en iOS)
    root.querySelector("#fSecCancel").onclick = closeSheet;

      const name = root.querySelector("#fSecName").value.trim();

        await dbPut("sectors", existing);

function openSectorMenu(sec){
  const hasParking = sec.lat!=null && sec.lng!=null;
  const hasZone = sec.zoneLat!=null && sec.zoneLng!=null;
  openSheet(`
    <h2>${escapeHtml(sec.name)}</h2>
    <div class="btn-row" style="flex-direction:column;">
      <button class="btn btn-ghost" id="mEdit" style="width:100%;">${t("btn_editar_nombre")}</button>
    </div>

    <div class="btn-row" style="flex-direction:column;">
      <button class="btn btn-ghost" id="mLoc" style="width:100%;">🅿️ ${hasParking?t("parking_actualizar"):t("parking_guardar")}</button>
      ${hasParking?`<button class="btn btn-success" id="mDirections" style="width:100%;">🧭 ${t("parking_llegar")}</button>`:""}

      if(!navigator.geolocation){ toast(t("toast_no_geo")); return; }
      root.querySelector("#mLoc").textContent = t("buscando_ubicacion");
      navigator.geolocation.getCurrentPosition(async (pos)=>{
        sec.lat = pos.coords.latitude;
        sec.lng = pos.coords.longitude;
        await dbPut("sectors", sec);
        closeSheet();
        toast(t("toast_parking_guardado"));
        render();
      }, ()=>{
        toast(t("toast_no_ubicacion"));
        root.querySelector("#mLoc").textContent = "🅿️ " + t("parking_guardar");
      }, {enableHighAccuracy:true, timeout:12000});
    };
    if(hasParking){
      root.querySelector("#mDirections").onclick = ()=>{
        openInMaps(sec.lat, sec.lng);
      };
    }
    root.querySelector("#mZoneLoc").onclick = ()=>{
      if(!navigator.geolocation){ toast(t("toast_no_geo")); return; }
      root.querySelector("#mZoneLoc").textContent = t("buscando_ubicacion");
      navigator.geolocation.getCurrentPosition(async (pos)=>{
        sec.zoneLat = pos.coords.latitude;
        sec.zoneLng = pos.coords.longitude;
        await dbPut("sectors", sec);
        closeSheet();
        toast(t("toast_zona_ubic_guardada"));
        render();
      }, ()=>{
        toast(t("toast_no_ubicacion"));
        root.querySelector("#mZoneLoc").textContent = "📍 " + t("zona_guardar");
      }, {enableHighAccuracy:true, timeout:12000});
    };
    if(hasZone){
      root.querySelector("#mZoneDirections").onclick = ()=>{
        openInMaps(sec.zoneLat, sec.zoneLng);
      };
    }
    root.querySelector("#mDelete").onclick = async ()=>{
      if(!confirm(t("sec_delete_confirm",sec.name))) return;
      const blocks = (await dbGetAll("blocks")).filter(b=>b.sectorId===sec.id);
      for(const b of blocks) await dbDelete("blocks", b.id);
      const routes = (await dbGetAll("routes")).filter(r=>r.sectorId===sec.id);
      for(const r of routes) await dbDelete("routes", r.id);
      await dbDelete("sectors", sec.id);
      closeSheet();
      toast(t("toast_sector_eliminado"));
      render();
    };
  });
}

function wireLocationGuideSection(sec){
  const hasLoc = sec.lat!=null && sec.lng!=null;
  const hasZoneLoc = sec.zoneLat!=null && sec.zoneLng!=null;
  const hasGuide = !!(sec.guide && sec.guide.blob);

  async function captureSecLocationDirect(){
    if(!navigator.geolocation){ toast(t("toast_no_geo")); return; }
    toast(t("buscando_ubicacion"));
    navigator.geolocation.getCurrentPosition(async (pos)=>{
      sec.lat = pos.coords.latitude;
      sec.lng = pos.coords.longitude;
      await dbPut("sectors", sec);
      toast(t("parking_guardado"));
      render();
    }, ()=>{
      toast(t("toast_no_ubicacion"));
    }, {enableHighAccuracy:true, timeout:12000});
  }
  async function captureZoneLocationDirect(){
    if(!navigator.geolocation){ toast(t("toast_no_geo")); return; }
    toast(t("buscando_ubicacion"));
    navigator.geolocation.getCurrentPosition(async (pos)=>{
      sec.zoneLat = pos.coords.latitude;
      sec.zoneLng = pos.coords.longitude;
      await dbPut("sectors", sec);
      toast(t("toast_zona_ubic_guardada"));
      render();
    }, ()=>{
      toast(t("toast_no_ubicacion"));
    }, {enableHighAccuracy:true, timeout:12000});
  }
  function openManualCoordsSheet(kind){
    const isParking = kind==="parking";
    openSheet(`
      <h2>${t("introducir_coordenadas")}</h2>
      <div class="sheet-sub">${isParking?t("parking_titulo_add"):t("zona_titulo_add")}</div>
      <label class="field-label">${t("latitud")}</label>
      <div class="coord-input-row">
        <input type="text" inputmode="decimal" id="manualLat" placeholder="40.7128">
        <button type="button" class="coord-sign-btn" id="manualLatSign" title="${t("invertir_signo")}">±</button>
      </div>
      <label class="field-label">${t("longitud")}</label>
      <div class="coord-input-row">
        <input type="text" inputmode="decimal" id="manualLng" placeholder="-3.7038">
        <button type="button" class="coord-sign-btn" id="manualLngSign" title="${t("invertir_signo")}">±</button>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" id="manualCoordsSave" style="width:100%;">${t("btn_guardar")}</button>
      </div>
    `,(root)=>{
      // autofocus quitado (evita el bug de doble toque en iOS)
      function toggleSign(input){

        if(v.startsWith("-")) input.value = v.slice(1);
        else if(v) input.value = "-"+v;
        else input.value = "-";

      root.querySelector("#manualLatSign").addEventListener("click",()=>toggleSign(root.querySelector("#manualLat")));
      root.querySelector("#manualLngSign").addEventListener("click",()=>toggleSign(root.querySelector("#manualLng")));
      root.querySelector("#manualCoordsSave").onclick = async ()=>{
        const lat = parseFloat(root.querySelector("#manualLat").value.replace(",","."));
        const lng = parseFloat(root.querySelector("#manualLng").value.replace(",","."));
        if(isNaN(lat) || isNaN(lng)){ toast(t("coords_invalidas")); return; }
        if(isParking){ sec.lat=lat; sec.lng=lng; } else { sec.zoneLat=lat; sec.zoneLng=lng; }
        await dbPut("sectors", sec);
        closeSheet();
        toast(isParking?t("parking_guardado"):t("toast_zona_ubic_guardada"));
        render();

  function openLocationChoiceSheet(kind){

      <h2>${isParking?t("parking_titulo_add"):t("zona_titulo_add")}</h2>
      <div class="btn-row" style="flex-direction:column;">
        <button class="btn btn-primary" id="locChoiceGps" style="width:100%;">📍 ${t("usar_ubicacion_actual")}</button>
        <button class="btn btn-ghost" id="locChoiceManual" style="width:100%;">✏️ ${t("introducir_coordenadas")}</button>
      </div>

      root.querySelector("#locChoiceGps").onclick = ()=>{
        closeSheet();
        isParking ? captureSecLocationDirect() : captureZoneLocationDirect();
      };
      root.querySelector("#locChoiceManual").onclick = ()=>{
        closeSheet();
        openManualCoordsSheet(kind);
      };
    });

  const locBtn = mainArea.querySelector("#locBarBtn");
  if(locBtn){

      if(hasLoc){ openInMaps(sec.lat, sec.lng); }
      else { openLocationChoiceSheet("parking"); }
    });
  }
  const locRemoveBtn = mainArea.querySelector("#locRemoveBtn");
  if(locRemoveBtn){
    locRemoveBtn.addEventListener("click",(e)=>{
      e.stopPropagation();
      openConfirmSheet(t("btn_quitar_ubicacion")+"?", t("parking_guardado_label"), t("btn_quitar_ubicacion"), async ()=>{
        sec.lat = null; sec.lng = null;

        toast(t("toast_ubicacion_quitada"));
        render();

    });

  const zoneLocBtn = mainArea.querySelector("#zoneLocBarBtn");
  if(zoneLocBtn){
    zoneLocBtn.addEventListener("click",()=>{
      if(hasZoneLoc){ openInMaps(sec.zoneLat, sec.zoneLng); }
      else { openLocationChoiceSheet("zone"); }
    });
  }
  const zoneRemoveBtn = mainArea.querySelector("#zoneRemoveBtn");
  if(zoneRemoveBtn){
    zoneRemoveBtn.addEventListener("click",(e)=>{
      e.stopPropagation();
      openConfirmSheet(t("btn_quitar_ubicacion")+"?", t("zona_ubic_label"), t("btn_quitar_ubicacion"), async ()=>{
        sec.zoneLat = null; sec.zoneLng = null;
