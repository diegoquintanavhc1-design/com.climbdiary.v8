  const remove = ()=>{ el.classList.remove("show"); setTimeout(()=>el.remove(), 420); };

}

function computeBlocksByMonth(doneBlocks){
  const now = new Date();
  const buckets = [];
  for(let i=5;i>=0;i--){
    const md = new Date(now.getFullYear(), now.getMonth()-i, 1);
    buckets.push({label: MONTH_NAMES[md.getMonth()].slice(0,3), year:md.getFullYear(), month:md.getMonth(), count:0});
  }
  for(const b of doneBlocks){
    if(!b.dateDone) continue;
    const d = new Date(b.dateDone);
    const bucket = buckets.find(x=>x.year===d.getFullYear() && x.month===d.getMonth());
    if(bucket) bucket.count++;
  }
  return buckets;
}

  setHeader(t("header_perfil"), t("header_perfil_sub"), false);
  fabBtn.style.display = "none";

  const [profile, locations, sectors, blocks, routes, seasonGoals] = await Promise.all([
    dbGet("meta","profile"), dbGetAll("locations"), dbGetAll("sectors"), dbGetAll("blocks"), dbGetAll("routes"), getSeasonGoals()
  ]);
  const name = profile ? profile.name : t("default_name");
  cachedProfileName = name;
  refreshProfilePhotoUrl(profile);
  updateHeroAvatar();
  const initials = name.trim().slice(0,2).toUpperCase();

  const doneBlocks = blocks.filter(b=>b.status==="done");
  const todoBlocks = blocks.filter(b=>b.status==="todo");
  const doneRoutes = routes.filter(r=>r.status==="done");
  const todoRoutes = routes.filter(r=>r.status==="todo");
  const doneAll = [...doneBlocks, ...doneRoutes];
  const todoAll = [...todoBlocks, ...todoRoutes];

  const achievements = computeAchievementsFor(doneAll, doneBlocks, doneRoutes, todoAll, sectors);
  const achievementBonus = achievements.filter(a=>a.current>=a.target).reduce((s,a)=>s+a.points,0);
  function itemPoints(item, isBoulder){
    const base = gradeToPoints(item.grade);
    const isFlash = isBoulder ? item.attempts==="flash" : (item.style==="flash"||item.style==="onsight");
    return isFlash ? Math.round(base*1.5) : base;
  }
  const basePoints = doneBlocks.reduce((s,b)=>s+itemPoints(b,true),0) + doneRoutes.reduce((s,r)=>s+itemPoints(r,false),0);
  const totalPoints = basePoints + Math.round(achievementBonus*0.4);

  function disciplineHighlights(doneItems, isRoute){
    const highestGrade = doneItems.length ? doneItems.slice().sort((a,b)=>gradeToPoints(b.grade)-gradeToPoints(a.grade))[0] : null;
    const flashItems = isRoute ? doneItems.filter(b=>b.style==="onsight"||b.style==="flash") : doneItems.filter(b=>b.attempts==="flash");
    const highestFlash = flashItems.length ? flashItems.slice().sort((a,b)=>gradeToPoints(b.grade)-gradeToPoints(a.grade))[0] : null;
    return `<div class="list-item highlights-card">
      <div class="highlight-row"><span>${isRoute?t("vias_totales"):t("bloques_totales")}</span><strong>${doneItems.length}</strong></div>
      <div class="highlight-row"><span>${t("grado_mas_alto")}</span><strong>${highestGrade&&highestGrade.grade?escapeHtml(displayGrade(highestGrade.grade)):t("sin_dato_guion")}</strong></div>
      <div class="highlight-row"><span>${t("flash_mas_alto")}</span><strong>${highestFlash&&highestFlash.grade?escapeHtml(displayGrade(highestFlash.grade)):t("sin_dato_guion")}</strong></div>
    </div>`;
  }
  html += `<div class="section-title">${t("modo_boulder")}</div>`;
  html += disciplineHighlights(doneBlocks, false);
  html += `<div class="section-title">${t("modo_via")}</div>`;
  html += disciplineHighlights(doneRoutes, true);

  function gradeBreakdown(doneItems){
    const gradeCounts = {};
    for(const b of doneItems){
      const g = (b.grade && b.grade.trim()) ? displayGrade(b.grade.trim()) : t("sin_grado");
      gradeCounts[g] = (gradeCounts[g]||0)+1;
    }
    const gradeEntries = Object.entries(gradeCounts).sort((a,b)=>{
      const ra = gradeRank(a[0]); const rb = gradeRank(b[0]);
      if(ra==null && rb==null) return 0;
      if(ra==null) return 1;
      if(rb==null) return -1;
      return ra - rb;
    });
    if(gradeEntries.length===0){
      return emptyState("📊", t("empty_grado_t"), t("empty_grado_s"));
    }
    const maxCount = Math.max(...gradeEntries.map(e=>e[1]));
    let h = `<div class="list-item">`;
    for(const [grade,count] of gradeEntries){
      const pct = Math.max(6, Math.round((count/maxCount)*100));
      h += `<div class="grade-row">
        <div class="glabel mono">${escapeHtml(grade)}</div>
        <div class="gbar-wrap"><div class="gbar" style="width:${pct}%;"></div></div>
        <div class="gcount">${count}</div>
      </div>`;
    }
    return h + `</div>`;
  }
  html += `<div class="section-title">${t("sec_bloques_grado")} (${t("modo_boulder")})</div>`;
  html += gradeBreakdown(doneBlocks);
  html += `<div class="section-title">${t("sec_vias_grado")} (${t("modo_via")})</div>`;

  function buildYearRecap(){
    const year = new Date().getFullYear();
    const yearBlocks = doneBlocks.filter(b=>b.dateDone && new Date(b.dateDone).getFullYear()===year);
    const yearRoutes = doneRoutes.filter(r=>r.dateDone && new Date(r.dateDone).getFullYear()===year);
    const yearItems = [...yearBlocks, ...yearRoutes];
    if(yearItems.length===0) return null;
    const topBlock = yearBlocks.length ? yearBlocks.slice().sort((a,b)=>gradeToPoints(b.grade)-gradeToPoints(a.grade))[0] : null;
    const topRoute = yearRoutes.length ? yearRoutes.slice().sort((a,b)=>gradeToPoints(b.grade)-gradeToPoints(a.grade))[0] : null;
    const locCounts = {};
    for(const it of yearItems){
      const sec = sectors.find(s=>s.id===it.sectorId);
      const loc = sec ? locations.find(l=>l.id===sec.locationId) : null;
      if(loc) locCounts[loc.name] = (locCounts[loc.name]||0)+1;
    }
    const topLocEntry = Object.entries(locCounts).sort((a,b)=>b[1]-a[1])[0] || null;
    const rockCounts = {};
    let rockTotal = 0;
    for(const it of yearItems){
      if(it.rockType){
        const label = yearBlocks.includes(it) ? tRockType(it.rockType) : it.rockType;
        rockCounts[label] = (rockCounts[label]||0)+1;
        rockTotal++;
      }
    }
    const topRockEntry = Object.entries(rockCounts).sort((a,b)=>b[1]-a[1])[0] || null;
    const rockPct = (topRockEntry && rockTotal) ? Math.round((topRockEntry[1]/rockTotal)*100) : null;
    const styleCounts = {};
    let styleTotal = 0;
    for(const it of yearItems){
      const tags = it.styleTags || it.climbStyles || [];
      for(const tag of tags){
        const label = yearBlocks.includes(it) ? tStyleTag(tag) : tag;
        styleCounts[label] = (styleCounts[label]||0)+1;
        styleTotal++;
      }
    }
    const topStyleEntry = Object.entries(styleCounts).sort((a,b)=>b[1]-a[1])[0] || null;
    const monthCounts = new Array(12).fill(0);
    for(const it of yearItems){ monthCounts[new Date(it.dateDone).getMonth()]++; }
    let bestMonthIdx = 0;
    for(let i=1;i<12;i++) if(monthCounts[i]>monthCounts[bestMonthIdx]) bestMonthIdx = i;
    const flashCount = yearItems.filter(it=>{
      if(yearBlocks.includes(it)) return it.attempts==="flash";
      return it.style==="flash" || it.style==="onsight";
    }).length;
    const flashPct = Math.round((flashCount/yearItems.length)*100);
    return {
      year, topBlock, topRoute, topLocEntry, topRockEntry, rockPct, topStyleEntry,
      bestMonthName: monthNames()[bestMonthIdx], bestMonthCount: monthCounts[bestMonthIdx], flashPct
    };
  }
  const recap = buildYearRecap();
  html += `<div class="section-title">${t("resumen_anual_titulo", new Date().getFullYear())}</div>`;
  if(!recap){
    html += emptyState("📊", t("empty_recap_t"), t("empty_recap_s"));
  } else {
    html += `<div class="list-item recap-card">
      <div class="highlight-row"><span>${t("recap_top_bloque")}</span><strong>${recap.topBlock?`${escapeHtml(recap.topBlock.name)} · ${escapeHtml(displayGrade((recap.topBlock.grade||"").toUpperCase()))}`:t("sin_dato_guion")}</strong></div>
      <div class="highlight-row"><span>${t("recap_top_via")}</span><strong>${recap.topRoute?`${escapeHtml(recap.topRoute.name)} · ${escapeHtml(displayGrade(recap.topRoute.grade||""))}`:t("sin_dato_guion")}</strong></div>
      <div class="highlight-row"><span>${t("recap_zona_favorita")}</span><strong>${recap.topLocEntry?escapeHtml(recap.topLocEntry[0]):t("sin_dato_guion")}</strong></div>
      <div class="highlight-row"><span>${t("recap_roca_favorita")}</span><strong>${recap.topRockEntry?`${recap.rockPct}% ${escapeHtml(recap.topRockEntry[0])}`:t("sin_dato_guion")}</strong></div>
      <div class="highlight-row"><span>${t("recap_estilo_favorito")}</span><strong>${recap.topStyleEntry?escapeHtml(recap.topStyleEntry[0]):t("sin_dato_guion")}</strong></div>
      <div class="highlight-row"><span>${t("recap_mejor_mes")}</span><strong>${recap.bestMonthCount>0?`${escapeHtml(recap.bestMonthName)} (${recap.bestMonthCount})`:t("sin_dato_guion")}</strong></div>
      <div class="highlight-row"><span>${t("recap_flash_ratio")}</span><strong>${recap.flashPct}%</strong></div>
    </div>`;
  }

  function styleBreakdown(items){
    const styleCounts = {};
    for(const it of items){
      const tags = it.styleTags || it.climbStyles || [];
      for(const tag of tags){
        let label = tStyleTag(tag);
        if(/placa/i.test(tag) && /adherencia/i.test(tag)) label = tStyleTag("Placa");
        styleCounts[label] = (styleCounts[label]||0)+1;
      }
    }
    const entries = Object.entries(styleCounts).sort((a,b)=>b[1]-a[1]);
    if(entries.length===0){
      return emptyState("🎨", t("empty_estilos_t"), t("empty_estilos_s"));
    }
    const maxCount = Math.max(...entries.map(e=>e[1]));
    let h = `<div class="list-item">`;
    for(const [style,count] of entries){
      const pct = Math.max(6, Math.round((count/maxCount)*100));
      h += `<div class="grade-row">

        <div class="gbar-wrap"><div class="gbar" style="width:${pct}%;"></div></div>

  const superProjectsAll = [...todoBlocks, ...todoRoutes].filter(it=>getPriority(it)==="super");
  const top5Super = superProjectsAll.slice().sort((a,b)=>(gradeRank(b.grade)??-1)-(gradeRank(a.grade)??-1)).slice(0,5);

    html += emptyState("⭐", t("empty_ninguno_t"), t("empty_super_top_s"));

      html += `<div class="list-item">
        <div style="display:flex;gap:10px;align-items:flex-start;">
          <div class="badge ${gradeColorClass(it.grade)} mono">${gTxt}</div>
          <div style="min-width:0;flex:1;">
            <div class="bname">${escapeHtml(it.name)}</div>
            <div class="bsub" style="font-size:0.78rem;color:var(--ink-700);margin-top:3px;">${loc?escapeHtml(loc.name):""}${sec?" · "+escapeHtml(sec.name):""}</div>
          </div>
        </div>
      </div>`;
    }
  }

  function achievementCardHtml(ach){
    const done = ach.current>=ach.target;
    const pct = Math.min(100, Math.round((ach.current/ach.target)*100));
    return `<div class="list-item achievement-card ${done?"achieved":""}">
      <div style="display:flex;gap:10px;align-items:center;">

  html += `<div class="section-title">${t("objetivos_temporada")}</div>
  <div class="wishlist-hint-legacy" style="font-size:0.76rem;color:var(--ink-700);margin:0 0 10px;">${t("objetivos_hint")}</div>`;

    seasonGoals.forEach(g=>{
      html += `<div class="goal-row">
        <button class="goal-check ${g.done?"done":""}" data-goal-toggle="${g.id}">${g.done?"✓":""}</button>

  html += `<div class="section-title">${t("sec_progreso_mensual")}</div>`;
  if(doneAll.length===0){
    html += emptyState("📈", t("empty_progreso_t"), t("empty_progreso_s"));

    html += `<div class="list-item"><canvas id="periodChart"></canvas></div>`;

  html += `<div class="section-title">${t("sec_comparativa_escalas")}</div>
  <div class="guide-hint">${t("comparativa_escalas_hint")}</div>
  <div class="list-item">
    <div class="scale-compare-header"><span>Font</span><span>V-scale</span></div>
    ${GRADE_CONVERSION.map(row=>{
      return `<div class="scale-compare-row"><span class="mono">${escapeHtml(row.font)}</span><span class="mono">${escapeHtml(row.vScale)}</span></div>`;
    }).join("")}
  </div>`;

  function itemsList(doneItems, emptyIcon, isBoulder, searchTerm, sortMode, styleFilter, rockFilter){
    const term = (searchTerm||"").trim().toLowerCase();
    let list = term ? doneItems.filter(b=>(b.name||"").toLowerCase().includes(term) || (b.grade||"").toLowerCase().includes(term)) : doneItems.slice();
    if(styleFilter && styleFilter.size>0){
      list = list.filter(b=>(b.styleTags||b.climbStyles||[]).some(tag=>styleFilter.has(tag)));
    }
    if(rockFilter && rockFilter.size>0){
      list = list.filter(b=>b.rockType && rockFilter.has(b.rockType));
    }
    if(sortMode==="best"){
      list.sort((a,b)=>(b.rating||0)-(a.rating||0));
    } else if(sortMode==="worst"){
      list.sort((a,b)=>(a.rating||0)-(b.rating||0));
    } else {
      list.sort((a,b)=>(b.dateDone||0)-(a.dateDone||0));
    }
    if(list.length===0){
      return term
        ? emptyState("🔍", t("busqueda_sin_resultados_t"), t("busqueda_sin_resultados_s"))
        : emptyState(emptyIcon, t("empty_ninguno_t"), t("empty_ninguno_s"));
    }
    let h = "";
    for(const b of list){
      const sec = sectors.find(s=>s.id===b.sectorId);
      const loc = sec ? locations.find(l=>l.id===sec.locationId) : null;
      const gTxt = b.grade ? (isBoulder ? escapeHtml(displayGrade(b.grade).toUpperCase()) : escapeHtml(displayGrade(b.grade))) : "?";
      h += `<div class="list-item">
        <div style="display:flex;gap:10px;align-items:flex-start;">
          <div class="badge ${gradeColorClass(b.grade)} mono">${gTxt}</div>
          <div style="min-width:0;flex:1;">
            <div class="bname">${escapeHtml(b.name)}</div>
            ${b.rating?`<div style="margin-top:3px;">${ratingBadgeHTML(b.rating)}</div>`:""}
            <div class="bsub" style="font-size:0.78rem;color:var(--ink-700);margin-top:3px;">${loc?escapeHtml(loc.name):""}${sec?" · "+escapeHtml(sec.name):""}</div>
          </div>
        </div>
      </div>`;
    }
    return h;
  }
  function perfilFilterActive(sortKey, styleKey, rockKey){
    return state[sortKey]!=="best" || state[styleKey].size>0 || state[rockKey].size>0;
  }
  html += `<div class="section-title">${t("sec_todos_bloques")}</div>`;

    <div class="search-bar" style="flex:1;margin:0;"><span class="search-icon">${searchIconSVG(14)}</span><input type="search" id="perfilBlockSearchInput" placeholder="${t("buscar_bloques_placeholder")}" value="${escapeAttr(state.perfilBlockSearch)}"></div>
    <button class="icon-btn-search ${perfilFilterActive("perfilBlockSort","perfilBlockStyleFilter","perfilBlockRockFilter")?"active":""}" id="perfilBlockFilterBtn" title="${t("filtros_titulo")}">${filterIconSVG(15)}</button>
  </div>`;
  html += `<div id="perfilBlocksArea">${itemsList(doneBlocks, "🏆", true, state.perfilBlockSearch, state.perfilBlockSort, state.perfilBlockStyleFilter, state.perfilBlockRockFilter)}</div>`;

  html += `<div class="section-title">${t("sec_todas_vias")}</div>`;
  html += `<div class="search-filter-row">
    <div class="search-bar" style="flex:1;margin:0;"><span class="search-icon">${searchIconSVG(14)}</span><input type="search" id="perfilRouteSearchInput" placeholder="${t("buscar_vias_placeholder")}" value="${escapeAttr(state.perfilRouteSearch)}"></div>
    <button class="icon-btn-search ${perfilFilterActive("perfilRouteSort","perfilRouteStyleFilter","perfilRouteRockFilter")?"active":""}" id="perfilRouteFilterBtn" title="${t("filtros_titulo")}">${filterIconSVG(15)}</button>
  </div>`;
  html += `<div id="perfilRoutesArea">${itemsList(doneRoutes, "🏆", false, state.perfilRouteSearch, state.perfilRouteSort, state.perfilRouteStyleFilter, state.perfilRouteRockFilter)}</div>`;

  mainArea.innerHTML = html;

      if(aDone!==bDone) return aDone?1:-1;

  function openPerfilFilterSheet(isBoulder){
    const sortKey = isBoulder ? "perfilBlockSort" : "perfilRouteSort";
    const styleKey = isBoulder ? "perfilBlockStyleFilter" : "perfilRouteStyleFilter";
    const rockKey = isBoulder ? "perfilBlockRockFilter" : "perfilRouteRockFilter";
    const btnId = isBoulder ? "perfilBlockFilterBtn" : "perfilRouteFilterBtn";
    const sortOptions = [
      {key:"best", label:t("orden_best")},
      {key:"worst", label:t("orden_worst")},
      {key:"recent", label:t("orden_recientes")},
    ];
    const hasActiveFilters = perfilFilterActive(sortKey, styleKey, rockKey);
    openSheet(`
      <h2>${t("filtros_titulo")}</h2>
      <label class="field-label">${t("ordenar_por")}</label>
      <div class="chip-grid" id="perfilSortChips">
        ${sortOptions.map(o=>`<div class="chip-choice ${state[sortKey]===o.key?'selected':''}" data-sort="${o.key}">${o.label}</div>`).join("")}
      </div>
      <label class="field-label">${t("filtrar_por_estilo")}</label>
      <div class="chip-grid" id="perfilStyleChips">
        ${STYLE_TAGS.map(s=>`<div class="chip-choice ${state[styleKey].has(s)?'selected':''}" data-style="${escapeAttr(s)}">${escapeHtml(tStyleTag(s))}</div>`).join("")}
      </div>
      <label class="field-label">${t("tipo_roca")}</label>
      <div class="chip-grid" id="perfilRockChips">
        ${ROCK_TYPES.map(r=>`<div class="chip-choice ${state[rockKey].has(r)?'selected':''}" data-rock="${escapeAttr(r)}">${escapeHtml(tRockType(r))}</div>`).join("")}
      </div>
      <div class="btn-row" style="flex-direction:column;margin-top:16px;">
        <button class="btn btn-primary" id="perfilFilterApply" style="width:100%;">${t("btn_aplicar")}</button>
        ${hasActiveFilters?`<button class="btn btn-ghost" id="perfilFilterClear" style="width:100%;">${t("btn_quitar_filtros")}</button>`:""}
      </div>
    `,(root)=>{
      let sortMode = state[sortKey];
      const styleSet = new Set(state[styleKey]);
      const rockSet = new Set(state[rockKey]);
      root.querySelectorAll("[data-sort]").forEach(el=>{
        el.addEventListener("click",()=>{
          sortMode = el.dataset.sort;
          root.querySelectorAll("[data-sort]").forEach(x=>x.classList.remove("selected"));
          el.classList.add("selected");
        });
      });
      root.querySelectorAll("[data-style]").forEach(el=>{
        el.addEventListener("click",()=>{
          const s = el.dataset.style;
          if(styleSet.has(s)){ styleSet.delete(s); el.classList.remove("selected"); }
          else { styleSet.add(s); el.classList.add("selected"); }
        });
      });
      root.querySelectorAll("[data-rock]").forEach(el=>{
        el.addEventListener("click",()=>{
          const r = el.dataset.rock;
          if(rockSet.has(r)){ rockSet.delete(r); el.classList.remove("selected"); }
          else { rockSet.add(r); el.classList.add("selected"); }
        });
      });
      root.querySelector("#perfilFilterApply").onclick = ()=>{
        state[sortKey] = sortMode;
        state[styleKey] = styleSet;
        state[rockKey] = rockSet;
        closeSheet();
        const btn = document.getElementById(btnId);
        if(btn) btn.classList.toggle("active", perfilFilterActive(sortKey, styleKey, rockKey));
        if(isBoulder) renderPerfilBlocksBody(); else renderPerfilRoutesBody();
      };
      const clearBtn = root.querySelector("#perfilFilterClear");
      if(clearBtn){
        clearBtn.onclick = ()=>{
          state[sortKey] = "best";
          state[styleKey] = new Set();
          state[rockKey] = new Set();
          closeSheet();
          const btn = document.getElementById(btnId);
          if(btn) btn.classList.remove("active");
          if(isBoulder) renderPerfilBlocksBody(); else renderPerfilRoutesBody();
        };
      }
    });
  }

async function doExportJson(){
  toast(t("toast_preparando_copia"));
  const [locations, sectors, blocks, routes, pdfs, training_logs, meta] = await Promise.all([
    dbGetAll("locations"), dbGetAll("sectors"), dbGetAll("blocks"), dbGetAll("routes"),
    dbGetAll("pdfs"), dbGetAll("training_logs"), dbGetAll("meta")
  ]);
  const pdfsB64 = await Promise.all(pdfs.map(p=>new Promise((res)=>{
    const reader = new FileReader();
    reader.onload = ()=>res({ id:p.id, filename:p.filename, locationId:p.locationId, size:p.size, addedAt:p.addedAt, dataUrl:reader.result });
    reader.onerror = ()=>res(null);
    reader.readAsDataURL(p.blob);
  })));
  function blobToDataUrl(blob){
    return new Promise((res)=>{
      const reader = new FileReader();
      reader.onload = ()=>res(reader.result);
      reader.onerror = ()=>res(null);
      reader.readAsDataURL(blob);
    });
  }
  async function withPhotoDataUrls(list){
    return Promise.all(list.map(async (item)=>{
      const copy = Object.assign({}, item);
      if(item.photos && item.photos.length){
        copy.photos = await Promise.all(item.photos.filter(p=>p&&(p.blob||p.dataUrl)).map(async (p)=>({
          id:p.id, addedAt:p.addedAt, dataUrl: p.dataUrl || await blobToDataUrl(p.blob)
        })));
      }
      return copy;
    }));
  }
  const blocksExport = await withPhotoDataUrls(blocks);
  const routesExport = await withPhotoDataUrls(routes);
  const data = {
    app:"Climb Diary", version:3, exportedAt:new Date().toISOString(),
    locations, sectors, blocks: blocksExport, routes: routesExport, training_logs, meta,
    pdfs: pdfsB64.filter(Boolean),
  };
  const blob = new Blob([JSON.stringify(data)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `climb-diary-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

async function doExportText(){
  const [locations, sectors, blocks, routes] = await Promise.all([
    dbGetAll("locations"), dbGetAll("sectors"), dbGetAll("blocks"), dbGetAll("routes")
  ]);
  const isEn = cachedSettings.language==="en";
  const L = isEn ? {
    title:"CLIMB DIARY — FULL BACKUP", generated:"Generated on",
    boulder:"BOULDER", route:"ROUTES", noArea:"(no locations yet)",
    grade:"Grade", status:"Status", done:"Done", todo:"To do",
    rating:"Rating", style:"Style", rock:"Rock type", comment:"Comment",
    fav:"Favorite", length:"Length", bolts:"Bolts", attempts:"Attempts",
    sendStyle:"Send style"
  } : {
    title:"CLIMB DIARY — COPIA COMPLETA", generated:"Generada el",
    boulder:"BOULDER", route:"VÍAS", noArea:"(sin zonas todavía)",
    grade:"Grado", status:"Estado", done:"Hecho", todo:"Por hacer",
    rating:"Valoración", style:"Estilo", rock:"Tipo de roca", comment:"Comentario",
    fav:"Favorito", length:"Altura", bolts:"Seguros", attempts:"Pegues",
    sendStyle:"Estilo de encadene"
  };
  function section(climbType, label){
    let out = `\n\n========================================\n${label}\n========================================\n`;
    const locs = locations.filter(l=>(l.climbType||"boulder")===climbType);
    if(locs.length===0){ out += `\n${L.noArea}\n`; return out; }
    for(const loc of locs){
      out += `\n--- ${loc.name} ---\n`;
      const secs = sectors.filter(s=>s.locationId===loc.id);
      for(const sec of secs){
        out += `\n  · ${sec.name}\n`;
        const items = climbType==="boulder"
          ? blocks.filter(b=>b.sectorId===sec.id)
          : routes.filter(r=>r.sectorId===sec.id);
        if(items.length===0){ out += `      (${isEn?"empty":"vacío"})\n`; continue; }
        for(const it of items){
          out += `      • ${it.name||(isEn?"Untitled":"Sin nombre")}`;
          if(it.grade) out += ` — ${L.grade}: ${it.grade}`;
          out += `\n`;
          out += `        ${L.status}: ${it.status==="done"?L.done:L.todo}`;
          if(it.favorite) out += ` | ★ ${L.fav}`;
          if(it.rating) out += ` | ${L.rating}: ${it.rating}`;
          out += `\n`;
          const styleTags = climbType==="boulder" ? it.styleTags : it.climbStyles;
          if(climbType==="route"){
            const extras = [];
            if(it.length) extras.push(`${L.length}: ${it.length}m`);
            if(it.bolts) extras.push(`${L.bolts}: ${it.bolts}`);
            if(it.numAttempts) extras.push(`${L.attempts}: ${it.numAttempts}`);
            if(it.style) extras.push(`${L.sendStyle}: ${routeStyleLabel(it.style)}`);
            if(extras.length) out += `        ${extras.join(" | ")}\n`;
          } else {
            if(it.attempts) out += `        ${L.attempts}: ${attemptLabel(it.attempts)}\n`;
          }
          if(styleTags && styleTags.length) out += `        ${L.style}: ${styleTags.map(tStyleTag).join(", ")}\n`;
          if(it.rockType) out += `        ${L.rock}: ${tRockType(it.rockType)}\n`;
          if(it.comment) out += `        ${L.comment}: ${it.comment}\n`;
        }
      }
    }
    return out;
  }
  let text = `${L.title}\n${L.generated}: ${new Date().toLocaleString()}\n`;
  text += section("boulder", L.boulder);
  text += section("route", L.route);
  const blob = new Blob([text], {type:"text/plain;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `climb-diary-copia-${new Date().toISOString().slice(0,10)}.txt`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

document.getElementById("backupFileInput").addEventListener("change",(e)=>{
  const file = e.target.files[0];
  e.target.value = "";
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(!confirm(t("confirm_importar"))) return;
      for(const store of ["locations","sectors","blocks","routes","training_logs","meta","pdfs"]){
        const db = await openDB();
        const tx = db.transaction(store,"readwrite");
        tx.objectStore(store).clear();
        await new Promise(res=>{ tx.oncomplete=res; });
      }
      for(const item of (data.locations||[])) await dbPut("locations", item);
      for(const item of (data.sectors||[])) await dbPut("sectors", item);
      for(const item of (data.blocks||[])){
        const b = Object.assign({}, item);
        if(b.photos && b.photos.length){
          b.photos = b.photos.filter(p=>p&&p.dataUrl).map(p=>({id:p.id, addedAt:p.addedAt, dataUrl:p.dataUrl}));
        }
        await dbPut("blocks", b);
      }
      for(const item of (data.routes||[])){
        const r = Object.assign({}, item);
        if(r.photos && r.photos.length){
          r.photos = r.photos.filter(p=>p&&p.dataUrl).map(p=>({id:p.id, addedAt:p.addedAt, dataUrl:p.dataUrl}));
        }
        await dbPut("routes", r);
      }
      for(const item of (data.training_logs||[])) await dbPut("training_logs", item);
      for(const item of (data.meta||[])) await dbPut("meta", item);
      for(const p of (data.pdfs||[])){
        try{
          const res = await fetch(p.dataUrl);
          const blob = await res.blob();
          await dbPut("pdfs", { id:p.id, filename:p.filename, locationId:p.locationId, size:p.size, addedAt:p.addedAt, blob });
        }catch(err){}
      }
      await loadSettings();
      const prof = await dbGet("meta","profile");
      cachedProfileName = prof ? prof.name : "";
      toast(t("toast_copia_importada"));
      render();
    }catch(err){
      alert(t("alert_copia_invalida"));
    }
  };
  reader.readAsText(file);
});

async function openPdfCacheManager(){
  const pdfs = await dbGetAll("pdfs");
  const locations = await dbGetAll("locations");
  const total = pdfs.reduce((s,p)=>s+(p.size||0),0);
  let html = `<h2>${t("guias_pdf_guardadas")}</h2>
    <div class="sheet-sub">${formatBytes(total)} · ${t("toca_liberar")}</div>`;
  if(pdfs.length===0){
    html += emptyState("📄", t("empty_cache_t"), t("empty_cache_s"));
  } else {
    for(const p of pdfs.slice().sort((a,b)=>(b.size||0)-(a.size||0))){
      const loc = locations.find(l=>l.id===p.locationId);
      html += `<div class="list-item pdf-item" data-cache-pdf="${p.id}">
        <div class="pdf-icon">PDF</div>
        <div class="pdf-info">
          <div class="pname">${escapeHtml(p.filename)}</div>
          <div class="psub">${loc?escapeHtml(loc.name):t("sin_zona")} · ${formatBytes(p.size)}</div>
        </div>
        <button class="card-menu-btn" style="position:static;font-size:16px;" data-cache-del="${p.id}">🗑</button>
      </div>`;
    }
  }
  openSheet(html,(root)=>{
    root.querySelectorAll("[data-cache-del]").forEach(el=>{
      el.addEventListener("click", async (e)=>{
        e.stopPropagation();
        const p = pdfs.find(x=>x.id===el.dataset.cacheDel);

        await dbDelete("pdfs", p.id);

      });
    });
  });
}

function searchIconSVG(size){
  size = size || 15;
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"></circle><line x1="20" y1="20" x2="15.3" y2="15.3"></line></svg>`;
}
function filterIconSVG(size){
  size = size || 16;
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"></line><line x1="7" y1="12" x2="17" y2="12"></line><line x1="10" y1="18" x2="14" y2="18"></line></svg>`;
}
function emptyState(icon,title,sub){
  return `<div class="empty-state"><div class="em-icon">${icon}</div><p style="font-weight:700;">${title}</p><p>${sub}</p></div>`;
}
function escapeHtml(s){
  return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }
function truncateNotesPreview(text, maxLen){
  if(!text) return "";
  const flat = text.replace(/^[-*•]\s+/gm,"").replace(/\r?\n/g," · ").trim();
  if(flat.length<=maxLen) return flat;
  return flat.slice(0,maxLen).trim()+"…";
}
function formatSessionNotes(text){
  if(!text) return "";
  const lines = String(text).split(/\r?\n/);
  let html = "";
  let inList = false;
  for(let raw of lines){
    const line = raw.trim();
    const isBullet = /^[-*•]\s+/.test(line);
    if(isBullet){
      if(!inList){ html += `<ul class="session-notes-list">`; inList = true; }
      html += `<li>${escapeHtml(line.replace(/^[-*•]\s+/,""))}</li>`;
    } else {
      if(inList){ html += `</ul>`; inList = false; }
      if(line) html += `<div class="session-notes-line">${escapeHtml(line)}</div>`;
    }
  }
  if(inList) html += `</ul>`;
  return html;
}
function formatBytes(n){
  if(!n) return "0 KB";
  if(n<1024*1024) return (n/1024).toFixed(0)+" KB";
  return (n/(1024*1024)).toFixed(1)+" MB";
}
function formatDate(d){
  if(!d) return "";
  const parts = d.split("-");
  return `${parts[2]}/${parts[1]}/${parts[0]}`;
}

/* Username: generación, validación, actualización              */
/* ---------------------------------------------------------- */
function slugifyBase(input){
  let base = (input||"").split("@")[0];
  base = base.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  base = base.replace(/[^a-z0-9._]/g,"").replace(/\s+/g,"");
  return base;
}
function generateDefaultUsername(nameOrEmail){
  let base = slugifyBase(nameOrEmail);
  if(!base) base = "climber";
  const suffix = Math.floor(Math.random()*9000)+1000;
  return `${base}_${suffix}`;
}
function validateUsername(username){
  return /^[a-z0-9._]{3,20}$/.test(username||"");
}
async function updateUserProfile(newName, newUsername){
  const existing = (await dbGet("meta","profile")) || {id:"profile"};
  existing.name = newName;
  existing.username = newUsername;
  await dbPut("meta", existing);
  cachedProfileName = newName;
  return existing;
}

function openOnboarding(){
  openSheet(`
    <h2>${t("bienvenido")}</h2>
    <div class="sheet-sub">${t("como_llamas")}</div>
    <div class="photo-picker-row">
      <div class="photo-picker-preview" id="obPhotoPreview">🧗</div>
      <label class="btn btn-ghost" for="obPhotoInput">${t("cambiar_foto")}</label>
      <input type="file" id="obPhotoInput" accept="image/*" style="display:none;">
    </div>
    <label class="field-label">${t("tu_nombre")}</label>
    <input type="text" id="obName" placeholder="${t("ph_ej_marta")}">
    <label class="field-label">${t("tu_peso")}</label>
    <input type="number" id="obWeight" min="1" step="0.1" placeholder="70">
    <label class="field-label">${t("tu_altura")}</label>
    <input type="number" id="obHeight" min="1" step="1" placeholder="175">
    <label class="field-label">${t("idioma_label")}</label>
    <div class="tabs-row" id="obLang">
      <button type="button" data-val="es" class="active">🇪🇸 Español</button>
      <button type="button" data-val="en">🇬🇧 English</button>
    </div>
    <label class="field-label">${t("escala_preferida_label")}</label>
    <div class="tabs-row" id="obScale">
      <button type="button" data-val="font" class="active">${t("font_label")}</button>
      <button type="button" data-val="vscale">${t("vscale_label")}</button>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="obSave">${t("btn_empezar")}</button>
    </div>
  `,(root)=>{
    let pendingPhoto = null;
    let selectedLang = "es";
    let selectedScale = "font";
    // autofocus quitado (evita el bug de doble toque en iOS)
    root.querySelectorAll("#obLang button").forEach(btn=>{
      btn.addEventListener("click",()=>{
        selectedLang = btn.dataset.val;
        root.querySelectorAll("#obLang button").forEach(b=>b.classList.remove("active"));
        btn.classList.add("active");
      });
    });
    root.querySelectorAll("#obScale button").forEach(btn=>{
      btn.addEventListener("click",()=>{
        selectedScale = btn.dataset.val;
        root.querySelectorAll("#obScale button").forEach(b=>b.classList.remove("active"));
        btn.classList.add("active");
      });
    });
    root.querySelector("#obPhotoInput").addEventListener("change",()=>{
      const inp = root.querySelector("#obPhotoInput");
      const f = inp.files && inp.files[0];
      if(!f) return;
      pendingPhoto = f;
      const url = URL.createObjectURL(f);
      root.querySelector("#obPhotoPreview").innerHTML = `<img src="${url}" alt="">`;
    });
    root.querySelector("#obSave").onclick = async ()=>{
      const name = root.querySelector("#obName").value.trim() || t("default_name");
      const username = generateDefaultUsername(name);
      const weight = parseFloat(root.querySelector("#obWeight").value) || null;
      const height = parseFloat(root.querySelector("#obHeight").value) || null;
      const profile = {id:"profile", name, username, weight, height};
      if(pendingPhoto) profile.avatarPhoto = pendingPhoto;
      await dbPut("meta", profile);
      await saveSettingsPatch({language:selectedLang, gradeSystem:selectedScale});
      closeSheet();
      render();
    };
  });
}

async function bootApp(){
  const bootStart = Date.now();
  await loadSettings();
  const name = await getProfile();
  cachedProfileName = name || "";
  try{ await refreshLevelBadge(); }catch(err){ console.error("boot level badge error:", err); }
  render();
  if(!name){
    setTimeout(openOnboarding, 200);
  }
  const minSplashMs = 1100;
  const elapsed = Date.now() - bootStart;
  const remaining = Math.max(0, minSplashMs - elapsed);
  setTimeout(()=>{
    const splash = document.getElementById("appSplash");
    if(splash){
      splash.classList.add("hide");
      setTimeout(()=>splash.remove(), 550);
    }
  }, remaining);
}

(async function init(){
  buildTopoBackground();
  await bootApp();
})();
})();
</script>
