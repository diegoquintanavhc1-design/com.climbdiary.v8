        toast(t("toast_ubicacion_quitada"));
        render();
      });
    });
  }
  const guidePillBtn = mainArea.querySelector("#guidePillBtn");
  if(guidePillBtn){
    guidePillBtn.addEventListener("click",(e)=>{
      if(hasGuide){
        e.preventDefault();
        openGuideViewer(sec, "sectors");
      } else {
        pendingGuideTarget = {type:"sector", id:sec.id};
      }
    });
  }
  const guideRemoveBtn = mainArea.querySelector("#guideRemoveBtn");
  if(guideRemoveBtn){
    guideRemoveBtn.addEventListener("click", async (e)=>{
      e.stopPropagation();
      openConfirmSheet(t("quitar_guia_titulo"), t("confirm_quitar_guia"), t("btn_quitar_guia"), async ()=>{
        sec.guide = null;
        await dbPut("sectors", sec);
        toast(t("toast_guia_eliminada"));
        render();
      });
    });
  }
}

async function renderBlocksView(loc, sec){
  setHeader(sec.name, loc.name, true);
  fabBtn.style.display = "flex";
  fabBtn.onclick = ()=>openBlockForm(sec);

  const allBlocks = (await dbGetAll("blocks")).filter(b=>b.sectorId===sec.id);
  allBlocks.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  const todoBlocks = allBlocks.filter(b=>b.status==="todo").sort((a,b)=>{
    const pr = priorityRank(a)-priorityRank(b);
    if(pr!==0) return pr;
    return (b.createdAt||0)-(a.createdAt||0);
  });
  const doneBlocks = allBlocks.filter(b=>b.status==="done").sort((a,b)=>{
    const fav = (b.favorite?1:0)-(a.favorite?1:0);
    if(fav!==0) return fav;
    return (b.dateDone||0)-(a.dateDone||0);
  });

  let html = locationGuideSectionHTML(sec);

  html += `<div class="section-title">${t("bloques_en",escapeHtml(sec.name))}</div>`;

  html += `<div class="tabs-row">
    <button data-f="todo" class="${state.blockFilter==='todo'?'active':''}">${t("tab_por_hacer",todoBlocks.length)}</button>
    <button data-f="done" class="${state.blockFilter==='done'?'active':''}">${t("tab_hechos",doneBlocks.length)}</button>
  </div>`;

  const hasActiveFilters = state.itemSortMode!=="recent" || state.itemStyleFilter.size>0 || !!state.itemGradeMin || !!state.itemGradeMax;
  html += `<div class="search-filter-row">
    <div class="search-bar" style="margin:0;flex:1;"><span class="search-icon">${searchIconSVG(14)}</span><input type="search" id="itemSearchInput" placeholder="${t("buscar_bloques_placeholder")}" value="${escapeAttr(state.itemSearchTerm)}"></div>
    <button class="icon-btn-search ${hasActiveFilters?'active':''}" id="itemFilterBtn" title="${t("filtros_titulo")}">${filterIconSVG(16)}</button>
  </div>`;
  html += `<div id="itemListArea"></div>`;

  mainArea.innerHTML = html;

  wireLocationGuideSection(sec);

  mainArea.querySelectorAll("[data-f]").forEach(el=>{
    el.addEventListener("click",()=>{ state.blockFilter = el.dataset.f; state.itemSearchTerm=""; render(); });
  });

  const listArea = document.getElementById("itemListArea");
  const fullList = state.blockFilter === "todo" ? todoBlocks : doneBlocks;

  function currentFilteredList(){
    const term = state.itemSearchTerm.trim().toLowerCase();
    let l = fullList;
    if(term) l = l.filter(b=>(b.name||"").toLowerCase().includes(term) || (b.grade||"").toLowerCase().includes(term));
    if(state.itemStyleFilter.size>0){
      l = l.filter(b=>(b.styleTags||[]).some(tag=>state.itemStyleFilter.has(tag)));
    }
    if(state.itemGradeMin || state.itemGradeMax){
      const minR = state.itemGradeMin ? gradeRank(state.itemGradeMin) : -Infinity;
      const maxR = state.itemGradeMax ? gradeRank(state.itemGradeMax) : Infinity;
      l = l.filter(b=>{
        const r = gradeRank(b.grade);
        return r!==null && r>=minR && r<=maxR;
      });
    }
    if(state.itemSortMode==="best"){
      l = l.slice().sort((a,b)=>(b.rating||0)-(a.rating||0));
    } else if(state.itemSortMode==="worst"){
      l = l.slice().sort((a,b)=>(a.rating||0)-(b.rating||0));
    } else if(state.itemSortMode==="grade_asc"){
      l = l.slice().sort((a,b)=>(gradeRank(a.grade)??0)-(gradeRank(b.grade)??0));
    } else if(state.itemSortMode==="grade_desc"){
      l = l.slice().sort((a,b)=>(gradeRank(b.grade)??0)-(gradeRank(a.grade)??0));
    }
    return l;
  }

  function renderListBody(){
    const list = currentFilteredList();
    revokeActivePhotoUrls();
    let bodyHtml = "";
    if(list.length===0){
      bodyHtml = state.itemSearchTerm.trim()
        ? emptyState("🔍", t("busqueda_sin_resultados_t"), t("busqueda_sin_resultados_s"))
        : (state.blockFilter==="todo"
          ? emptyState("🎯", t("empty_pendiente_t"), t("empty_pendiente_s"))
          : emptyState("🏆", t("empty_hechos_t"), t("empty_hechos_s")));
    } else if(state.blockFilter==="todo" && state.itemSortMode==="recent"){
      let lastGroup = null;
      for(const b of list){
        const p = getPriority(b);
        const grp = p==="radar" ? "radar" : (p==="discarded" ? "discarded" : "main");
        if(grp !== lastGroup && grp !== "main"){
          if(grp==="discarded") bodyHtml += `<div class="section-title">${t("sec_descartados")}</div>`;
        }
        lastGroup = grp;
        bodyHtml += renderBlockRow(b);
      }
    } else {
      for(const b of list){
        bodyHtml += renderBlockRow(b);
      }
    }
    listArea.innerHTML = bodyHtml;
    wireListBody(list);
  }

  function wireListBody(list){
    listArea.querySelectorAll("[data-block]").forEach(el=>{
      el.addEventListener("click",(e)=>{
        if(e.target.closest("[data-action], textarea, input, label")) return;
        const expand = el.querySelector(".block-expand");
        const wasOpen = expand.classList.contains("open");
        listArea.querySelectorAll(".block-expand.open").forEach(x=>x.classList.remove("open"));
        listArea.querySelectorAll("[data-block].expanded").forEach(x=>x.classList.remove("expanded"));
        if(!wasOpen){ expand.classList.add("open"); el.classList.add("expanded"); }
      });
    });

    listArea.querySelectorAll("[data-action=complete]").forEach(el=>{
      el.addEventListener("click",(e)=>{
        e.stopPropagation();
        const block = list.find(b=>b.id===el.dataset.block);
        openCompleteForm(block);
      });
    });
    listArea.querySelectorAll("[data-action=abandon]").forEach(el=>{
      el.addEventListener("click",(e)=>{
        e.stopPropagation();
        const block = list.find(b=>b.id===el.dataset.block);
        openAbandonForm(block);
      });
    });
    listArea.querySelectorAll("[data-action=priority-normal]").forEach(el=>{
      el.addEventListener("click", async (e)=>{
        e.stopPropagation();
        const block = list.find(b=>b.id===el.dataset.block);
        block.priority = "normal";
        block.favorite = false;
        block.createdAt = Date.now();
        await dbPut("blocks", block);
        render();
      });
    });
    listArea.querySelectorAll("[data-action=priority-super]").forEach(el=>{
      el.addEventListener("click", async (e)=>{
        e.stopPropagation();
        const block = list.find(b=>b.id===el.dataset.block);
        const isActive = getPriority(block)==="super";
        block.priority = isActive ? "normal" : "super";
        block.favorite = !isActive;
        block.createdAt = Date.now();
        await dbPut("blocks", block);
        if(!isActive) playSuperProjectChime();
        render();
      });
    });
    listArea.querySelectorAll("[data-action=priority-radar]").forEach(el=>{
      el.addEventListener("click", async (e)=>{
        e.stopPropagation();
        const block = list.find(b=>b.id===el.dataset.block);
        const isActive = getPriority(block)==="radar";
        block.priority = isActive ? "normal" : "radar";
        block.favorite = false;
        block.createdAt = Date.now();
        await dbPut("blocks", block);
        if(!isActive) playRadarPing();
        render();
      });
    });
    listArea.querySelectorAll("[data-action=save-comment]").forEach(el=>{
      el.addEventListener("click", async (e)=>{
        e.stopPropagation();
        const block = list.find(b=>b.id===el.dataset.block);
        const ta = listArea.querySelector(`textarea[data-comment-for="${block.id}"]`);
        block.comment = ta.value.trim();
        await dbPut("blocks", block);
        toast(t("toast_nota_guardada"));
        render();
      });
    });
    listArea.querySelectorAll("[data-action=toggle-favorite]").forEach(el=>{
      el.addEventListener("click", async (e)=>{
        e.stopPropagation();
        const block = list.find(b=>b.id===el.dataset.block);
        block.favorite = !block.favorite;
        await dbPut("blocks", block);
        render();
      });
    });
    listArea.querySelectorAll("[data-action=edit]").forEach(el=>{
      el.addEventListener("click",(e)=>{
        e.stopPropagation();
        const block = list.find(b=>b.id===el.dataset.block);
        openBlockForm(sec, block);
      });
    });
    listArea.querySelectorAll("[data-action=delete]").forEach(el=>{
      el.addEventListener("click",async (e)=>{
        e.stopPropagation();
        if(!confirm(t("confirm_del_bloque"))) return;
        await dbDelete("blocks", el.dataset.block);
        toast(t("toast_bloque_eliminado"));
        render();
      });
    });
    listArea.querySelectorAll("[data-action=add-photo]").forEach(el=>{
      el.addEventListener("click",(e)=>{
        e.stopPropagation();
        pendingPhotoBlockId = el.dataset.block;
      });
    });
    listArea.querySelectorAll("[data-photo-view]").forEach(el=>{
      el.addEventListener("click",(e)=>{
        e.stopPropagation();
        const block = list.find(b=>b.id===el.dataset.block);
        if(block) openPhotoLightbox(block, el.dataset.photoView);
      });
    });
  }

  renderListBody();

  document.getElementById("itemSearchInput").addEventListener("input",(e)=>{
    state.itemSearchTerm = e.target.value;
    renderListBody();
  });

  document.getElementById("itemFilterBtn").addEventListener("click",()=>{
    openItemFilterSheet(STYLE_TAGS, currentGradeList(), ()=>{
      const btn = document.getElementById("itemFilterBtn");
      if(btn) btn.classList.toggle("active", state.itemSortMode!=="recent" || state.itemStyleFilter.size>0 || !!state.itemGradeMin || !!state.itemGradeMax);
      renderListBody();
    });
  });
}

function renderBlockRow(b){
  const isDone = b.status === "done";
  const gradeTxt = b.grade ? escapeHtml(displayGrade(b.grade).toUpperCase()) : "?";
  const priority = getPriority(b);
  const isDiscarded = !isDone && priority==="discarded";
  let topCornerHtml = "";
  let priorityBadgeHtml = "";
  if(isDone){
    if(b.dateDone) topCornerHtml = `<div class="card-corner"><span class="done-date">${formatDoneDate(b.dateDone)}</span></div>`;
  } else if(priority==="super"){
    priorityBadgeHtml = `<div class="card-corner"><div class="super-project-badge">${t("super_proyecto_on")}</div></div>`;
  } else if(priority==="radar"){
    priorityBadgeHtml = `<div class="card-corner"><div class="radar-badge">${t("radar_badge")}</div></div>`;
  } else if(priority==="discarded"){
    priorityBadgeHtml = `<div class="card-corner"><div class="discarded-badge">${t("descartado_badge")}</div></div>`;
  } else {
    priorityBadgeHtml = `<div class="card-corner"><span class="proyecto-plain-label">${t("proyecto_badge")}</span></div>`;
  }
  let noteHtml = "";
  if(isDiscarded && b.discardReason){
    noteHtml = `<div class="bsub bsub-truncate">🗑️ ${escapeHtml(b.discardReason)}</div>`;
  } else if(!isDone && b.comment){
    noteHtml = `<div class="bsub bsub-truncate">${escapeHtml(b.comment)}</div>`;
  }
  let detailRows = "";
  if(isDone && b.comment){
    detailRows += `<div class="review-line"><strong>${t("resena_label")}:</strong> ${escapeHtml(b.comment)}</div>`;
  }
  if(b.blockNumber) detailRows += `<div class="block-detail-row"><span class="block-detail-label">${t("numero_bloque")}</span><span class="block-detail-value">#${b.blockNumber}</span></div>`;
  if((b.styleTags||[]).length) detailRows += `<div class="block-detail-row"><span class="block-detail-label">${t("estilo_escalada")}</span><span class="block-detail-value">${(b.styleTags||[]).map(tag=>escapeHtml(tStyleTag(tag))).join(", ")}</span></div>`;
  if(b.rockType) detailRows += `<div class="block-detail-row"><span class="block-detail-label">${t("tipo_roca")}</span><span class="block-detail-value">${escapeHtml(tRockType(b.rockType))}</span></div>`;
  if(isDone && b.attempts) detailRows += `<div class="block-detail-row"><span class="block-detail-label">${t("intentos")}</span><span class="block-detail-value">${attemptLabel(b.attempts)}</span></div>`;
  if(isDone && b.sessions) detailRows += `<div class="block-detail-row"><span class="block-detail-label">${t("num_sesiones")}</span><span class="block-detail-value">${b.sessions}</span></div>`;
  if(isDone && b.dateDone) detailRows += `<div class="block-detail-row"><span class="block-detail-label">${t("fecha_encadene")}</span><span class="block-detail-value">${formatDoneDate(b.dateDone)}</span></div>`;
  if(b.lat!=null && b.lng!=null) detailRows += `<div class="block-detail-row"><span class="block-detail-label">📍 ${t("coordenadas_bloque_label")}</span><button class="block-detail-value" data-open-maps-lat="${b.lat}" data-open-maps-lng="${b.lng}" style="background:none;border:none;padding:0;font:inherit;color:var(--rust-600); text-decoration:none;cursor:pointer;">${t("btn_como_llegar_corto")}</button></div>`;
  const priorityCardClass = !isDone ? (priority!=="normal" ? `priority-${priority}-bg` : "priority-normal-flat") : "";
  return `<div class="list-item ${priorityCardClass}" data-block="${b.id}">
    <div class="card-header-wrap ${isDiscarded?"discarded-fade":""}">
      ${topCornerHtml}${priorityBadgeHtml}
      <div class="block-row">
        <div class="badge ${gradeColorClass(b.grade)} mono">${gradeTxt}</div>
        <div class="block-info">
          <div class="bname">${escapeHtml(b.name)}${(isDone && b.favorite) ? `<span class="favorite-star" aria-hidden="true">★</span>` : ""}</div>
          ${(isDone && b.rating) ? `<div class="rating-under-name">${ratingBadgeHTML(b.rating)}</div>` : ""}
          ${noteHtml}
        </div>
      </div>
    </div>
    <div class="block-expand">
      ${detailRows?`<div class="block-detail-rows">${detailRows}</div>`:""}
      ${isDone ? `` : `
        <div class="btn-row">
          <button class="btn btn-xs btn-success" style="flex:1;" data-action="complete" data-block="${b.id}">${t("btn_conseguido")}</button>
          <button class="btn btn-xs btn-ghost ${priority==='super'?'btn-priority-active-super':''}" data-action="priority-super" data-block="${b.id}">${t("super_proyecto_on")}</button>
        </div>
        <div class="btn-row">
          <button class="btn btn-xs btn-ghost ${priority==='normal'?'btn-priority-active-normal':''}" data-action="priority-normal" data-block="${b.id}">${t("proyecto_badge")}</button>
          <button class="btn btn-xs btn-ghost ${priority==='radar'?'btn-priority-active-radar':''}" data-action="priority-radar" data-block="${b.id}">${t("radar_badge")}</button>
          <button class="btn btn-xs btn-ghost ${priority==='discarded'?'btn-priority-active-discarded':''}" data-action="abandon" data-block="${b.id}">🗑️ ${t("btn_abandono")}</button>
        </div>
        <label class="field-label">${t("que_falto_opcional")}</label>
        <textarea data-comment-for="${b.id}" placeholder="${t("ph_notas")}">${escapeHtml(b.comment||"")}</textarea>
        <div class="btn-row">
          <button class="btn btn-ghost" data-action="save-comment" data-block="${b.id}">${t("btn_guardar_nota")}</button>
        </div>
        <label class="field-label">${t("fotos")}</label>
        <div class="photos-hint">${t("fotos_hint")}</div>
        <div class="block-photos">
          ${(b.photos||[]).filter(p=>p&&(p.blob||p.dataUrl)).map(p=>`<div class="photo-thumb" data-photo-view="${p.id}" data-block="${b.id}"><img src="${photoUrl(p)}" alt=""></div>`).join("")}
          <label class="photo-add-btn" data-action="add-photo" data-block="${b.id}" for="blockPhotoInput">+</label>
        </div>
      `}
      <div class="secondary-actions-row">
        ${isDone?`<button class="btn-text ${b.favorite?'active-fav':''}" data-action="toggle-favorite" data-block="${b.id}">${b.favorite?t("favorite_on"):t("favorite_add")}</button>`:""}
        <button class="btn-text" data-action="edit" data-block="${b.id}">${t("btn_editar")}</button>
        <button class="btn-text danger" data-action="delete" data-block="${b.id}">${t("btn_eliminar")}</button>
      </div>
    </div>
  </div>`;
}

function openBlockForm(sec, existing){
  const grades = currentGradeList();
  const initialGrade = (existing && existing.grade && grades.includes(existing.grade)) ? existing.grade : (grades.includes("4+") ? "4+" : (grades.includes("VB") ? "VB" : grades[0]));
  const customStyleTags = existing ? (existing.styleTags||[]).filter(tg=>!STYLE_TAGS.includes(tg)) : [];
  const customRockType = (existing && existing.rockType && !ROCK_TYPES.includes(existing.rockType)) ? existing.rockType : null;
  openSheet(`
    <h2>${t("block_form_title",!!existing)}</h2>
    <div class="sheet-sub">${t("sec_en",escapeHtml(sec.name))}</div>
    <label class="field-label">${t("block_name")}</label>
    <input type="text" id="fBName" value="${existing?escapeAttr(existing.name):""}" placeholder="${t("ph_nombre_bloque")}">
    <label class="field-label">${t("grado")}</label>
    <div id="fBGradeWheelWrap">${buildGradeWheelHTML("fBGradeWheel", grades, initialGrade)}</div>
    <label class="field-label">${t("numero_bloque")}</label>
    <input type="number" id="fBNumber" min="0" step="1" value="${existing&&existing.blockNumber?existing.blockNumber:""}" placeholder="${t("ph_numero_bloque")}">
    <label class="field-label">${t("estilo_elige")}</label>
    <div class="chip-grid" id="fBStyleTags">
      ${STYLE_TAGS.map(tag=>`<div class="chip-choice ${existing&&(existing.styleTags||[]).includes(tag)?"selected":""}" data-tag="${escapeAttr(tag)}">${escapeHtml(tStyleTag(tag))}</div>`).join("")}
      ${customStyleTags.map(tag=>`<div class="chip-choice selected" data-tag="${escapeAttr(tag)}">${escapeHtml(tag)}</div>`).join("")}
      <div class="chip-choice chip-add" id="fBStyleAddBtn">+</div>
    </div>
    <div class="custom-chip-row" id="fBStyleCustomRow" style="display:none;">
      <input type="text" id="fBStyleCustomInput" class="custom-chip-input" placeholder="${t("ph_personalizado")}">
      <button type="button" class="chip-confirm-btn" id="fBStyleCustomConfirm">✓</button>
    </div>
    <label class="field-label">${t("tipo_roca")}</label>
    <div class="chip-grid" id="fBRockType">
      ${ROCK_TYPES.map(r=>`<div class="chip-choice ${existing&&existing.rockType===r?"selected":""}" data-rock="${escapeAttr(r)}">${escapeHtml(tRockType(r))}</div>`).join("")}
      ${customRockType?`<div class="chip-choice selected" data-rock="${escapeAttr(customRockType)}">${escapeHtml(customRockType)}</div>`:""}
      <div class="chip-choice chip-add" id="fBRockAddBtn">+</div>
    </div>
    <div class="custom-chip-row" id="fBRockCustomRow" style="display:none;">
      <input type="text" id="fBRockCustomInput" class="custom-chip-input" placeholder="${t("ph_personalizado")}">
      <button type="button" class="chip-confirm-btn" id="fBRockCustomConfirm">✓</button>
    </div>
    <label class="field-label">${t("estado")}</label>
    <div class="tabs-row">
      <button type="button" id="fBTodo" class="${(!existing||existing.status==='todo')?'active':''}">${t("por_hacer")}</button>
      <button type="button" id="fBDone" class="${(existing&&existing.status==='done')?'active':''}">${t("hecho")}</button>
    </div>
    <div id="fBPriorityWrap">
      <label class="field-label">${t("prioridad_label")}</label>
      <div class="chip-grid" id="fBPriority">
        <div class="chip-choice" data-priority="normal">${t("prioridad_normal")}</div>
        <div class="chip-choice" data-priority="super">${t("super_proyecto_on")}</div>
        <div class="chip-choice" data-priority="radar">${t("radar_badge")}</div>
        <div class="chip-choice" data-priority="discarded">${t("descartado_badge")}</div>
      </div>
      <div id="fBDiscardReasonWrap" style="display:none;">
        <label class="field-label">${t("motivo_descarte")}</label>
        <textarea id="fBDiscardReason" placeholder="${t("ph_motivo_descarte")}">${existing?escapeHtml(existing.discardReason||""):""}</textarea>
      </div>
    </div>
    <div id="fBCommentWrap">
      <label class="field-label" id="fBCommentLabel">${t("que_falto_opcional")}</label>
      <textarea id="fBComment" placeholder="${t("ph_notas")}">${existing?escapeHtml(existing.comment||""):""}</textarea>
    </div>
    <div id="fBRatingWrap" style="display:none;">
      <label class="field-label">${t("puntuacion")}</label>
      <div class="rating-dots" id="fBStars"></div>
      <label class="field-label">${t("intentos")}</label>
      <div class="chip-grid" id="fBAttempts">
        ${ATTEMPT_OPTIONS.map(a=>`<div class="chip-choice ${existing&&existing.attempts===a?"selected":""}" data-attempt="${a}">${attemptLabel(a)}</div>`).join("")}
      </div>
      <label class="field-label">${t("fecha_encadene")}</label>
      <input type="date" id="fBDateDone" value="${tsToDateInputValue(existing&&existing.dateDone)}">
    </div>
    <label class="field-label">${t("fotos")}</label>
    <div class="photos-hint">${t("fotos_hint")}</div>
    <div class="block-photos" id="fBPhotos"></div>
    <input type="file" id="fBPhotoInput" accept="image/*" multiple style="display:none;">
    <details class="block-coords-details">
      <summary><span class="guide-plus">+</span> ${t("coordenadas_bloque_label")}</summary>
      <div class="sheet-sub" style="margin:6px 0 6px;">${t("coordenadas_bloque_hint")}</div>
      <div class="coord-input-row">
        <input type="text" inputmode="decimal" id="fBLat" placeholder="${t("latitud")}" value="${existing&&existing.lat!=null?existing.lat:""}">
        <button type="button" class="coord-sign-btn" id="fBLatSign" title="${t("invertir_signo")}">±</button>
      </div>
      <div class="coord-input-row" style="margin-top:6px;">
        <input type="text" inputmode="decimal" id="fBLng" placeholder="${t("longitud")}" value="${existing&&existing.lng!=null?existing.lng:""}">
        <button type="button" class="coord-sign-btn" id="fBLngSign" title="${t("invertir_signo")}">±</button>
      </div>
    </details>
    <div class="btn-row">
      <button class="btn btn-primary" id="fBSave">${t("btn_guardar")}</button>
      <button class="btn btn-ghost" id="fBCancel">${t("btn_cancelar")}</button>
    </div>
  `,(root)=>{
    let status = existing ? existing.status : "todo";
    let rating = existing ? (existing.rating||0) : 0;
    let selectedGrade = initialGrade;
    let selectedAttempt = existing ? (existing.attempts||null) : null;
    let selectedTags = new Set(existing ? (existing.styleTags||[]) : []);
    let selectedRock = existing ? (existing.rockType||null) : null;
    let selectedPriority = existing ? getPriority(existing) : "normal";
    let formPhotos = existing && existing.photos ? existing.photos.filter(p=>p&&(p.blob||p.dataUrl)).slice() : [];
    const todoBtn = root.querySelector("#fBTodo");
    const doneBtn = root.querySelector("#fBDone");
    const ratingWrap = root.querySelector("#fBRatingWrap");
    const priorityWrap = root.querySelector("#fBPriorityWrap");
    const discardReasonWrap = root.querySelector("#fBDiscardReasonWrap");
    const commentLabel = root.querySelector("#fBCommentLabel");
    const starsWrap = root.querySelector("#fBStars");
    const photosWrap = root.querySelector("#fBPhotos");
    const photoInput = root.querySelector("#fBPhotoInput");
    photoInput.addEventListener("change", async ()=>{
      const files = Array.from(photoInput.files||[]);
      photoInput.value = "";
      for(const f of files){
        try{
          const dataUrl = await compressImageToDataUrl(f);
          formPhotos.push({id:uid(), dataUrl, addedAt:Date.now()});
        }catch(err){ console.error("photo read error", err); }
      }
      refreshPhotos();
    });

    function refreshPhotos(){
      photosWrap.innerHTML = formPhotos.map((p,i)=>`
        <div class="photo-thumb-editable">
          <img src="${photoUrl(p)}" alt="">
          <button type="button" class="photo-thumb-remove" data-idx="${i}">×</button>
        </div>
      `).join("") + `<label class="photo-add-btn" for="fBPhotoInput">+</label>`;
      photosWrap.querySelectorAll("[data-idx]").forEach(btn=>{
        btn.addEventListener("click",()=>{
          formPhotos.splice(parseInt(btn.dataset.idx,10),1);
          refreshPhotos();
        });
      });
    }
    refreshPhotos();

    wireGradeWheel("fBGradeWheel", grades, initialGrade, (g)=>{ selectedGrade = g; });

    root.querySelectorAll("[data-tag]").forEach(wireTagChipEl);
    function wireTagChipEl(el){
      el.addEventListener("click",()=>{
        const tg = el.dataset.tag;
        if(selectedTags.has(tg)){ selectedTags.delete(tg); el.classList.remove("selected"); }
        else { selectedTags.add(tg); el.classList.add("selected"); }
      });
    }
    const fBStyleAddBtn = root.querySelector("#fBStyleAddBtn");
    const fBStyleCustomRow = root.querySelector("#fBStyleCustomRow");
    const fBStyleCustomInput = root.querySelector("#fBStyleCustomInput");
    const fBStyleGrid = root.querySelector("#fBStyleTags");
    fBStyleAddBtn.addEventListener("click",(e)=>{
      e.stopPropagation();
      const show = fBStyleCustomRow.style.display==="none";
      fBStyleCustomRow.style.display = show ? "" : "none";
      if(show) fBStyleCustomInput.focus();
    });
    function commitStyleCustom(){
      const val = fBStyleCustomInput.value.trim();
      if(val && !selectedTags.has(val)){
        const chip = document.createElement("div");
        chip.className = "chip-choice selected";
        chip.dataset.tag = val;
        chip.textContent = val;
        fBStyleGrid.insertBefore(chip, fBStyleAddBtn);
        selectedTags.add(val);
        wireTagChipEl(chip);
      }
      fBStyleCustomInput.value = "";
      fBStyleCustomRow.style.display = "none";
    }
    fBStyleCustomInput.addEventListener("keydown",(e)=>{ if(e.key==="Enter"){ e.preventDefault(); commitStyleCustom(); } });
    root.querySelector("#fBStyleCustomConfirm").addEventListener("click",(e)=>{ e.stopPropagation(); commitStyleCustom(); });

    root.querySelectorAll("[data-rock]").forEach(wireRockChipEl);
    function wireRockChipEl(el){
      el.addEventListener("click",()=>{
        const r = el.dataset.rock;
        selectedRock = (selectedRock===r) ? null : r;
        root.querySelectorAll("[data-rock]").forEach(x=>x.classList.remove("selected"));
        if(selectedRock) el.classList.add("selected");
      });
    }
    const fBRockAddBtn = root.querySelector("#fBRockAddBtn");
    const fBRockCustomRow = root.querySelector("#fBRockCustomRow");
    const fBRockCustomInput = root.querySelector("#fBRockCustomInput");
    const fBRockGrid = root.querySelector("#fBRockType");
    fBRockAddBtn.addEventListener("click",(e)=>{
      e.stopPropagation();
      const show = fBRockCustomRow.style.display==="none";
      fBRockCustomRow.style.display = show ? "" : "none";
      if(show) fBRockCustomInput.focus();
    });
    function commitRockCustom(){
      const val = fBRockCustomInput.value.trim();
      if(val){
        const chip = document.createElement("div");
        chip.className = "chip-choice selected";
        chip.dataset.rock = val;
        chip.textContent = val;
        fBRockGrid.querySelectorAll("[data-rock]").forEach(x=>x.classList.remove("selected"));
        fBRockGrid.insertBefore(chip, fBRockAddBtn);
        selectedRock = val;
        wireRockChipEl(chip);
      }
      fBRockCustomInput.value = "";
      fBRockCustomRow.style.display = "none";
    }
    fBRockCustomInput.addEventListener("keydown",(e)=>{ if(e.key==="Enter"){ e.preventDefault(); commitRockCustom(); } });
    root.querySelector("#fBRockCustomConfirm").addEventListener("click",(e)=>{ e.stopPropagation(); commitRockCustom(); });
    root.querySelectorAll("[data-attempt]").forEach(el=>{
      el.addEventListener("click",()=>{
        const a = el.dataset.attempt;
        selectedAttempt = (selectedAttempt===a) ? null : a;
        root.querySelectorAll("[data-attempt]").forEach(x=>x.classList.remove("selected"));
        if(selectedAttempt) el.classList.add("selected");
      });
    });
    function syncPriorityUI(){
      root.querySelectorAll("[data-priority]").forEach(x=>{
        x.classList.toggle("selected", x.dataset.priority===selectedPriority);
      });
      discardReasonWrap.style.display = selectedPriority==="discarded" ? "" : "none";
    }
    root.querySelectorAll("[data-priority]").forEach(el=>{
      el.addEventListener("click",()=>{
        selectedPriority = el.dataset.priority;
        syncPriorityUI();
      });
    });
    syncPriorityUI();

    function drawStars(){
      drawRatingPicker(starsWrap, rating, (v)=>{ rating=v; drawStars(); });
    }
    function syncStatusUI(){
      todoBtn.classList.toggle("active", status==="todo");
      doneBtn.classList.toggle("active", status==="done");
      ratingWrap.style.display = status==="done" ? "" : "none";
      priorityWrap.style.display = status==="todo" ? "" : "none";
      commentLabel.textContent = status==="done" ? t("tu_resena_opcional") : t("que_falto_opcional");
    }
    todoBtn.onclick = ()=>{ status="todo"; syncStatusUI(); };
    doneBtn.onclick = ()=>{ status="done"; syncStatusUI(); };
    drawStars();
    syncStatusUI();
    // autofocus quitado (evita el bug de doble toque en iOS)

    function toggleCoordSign(input){
      const v = input.value.trim();
      if(v.startsWith("-")) input.value = v.slice(1);
      else if(v) input.value = "-"+v;
      else input.value = "-";
    }
    root.querySelector("#fBLatSign").addEventListener("click",()=>toggleCoordSign(root.querySelector("#fBLat")));
    root.querySelector("#fBLngSign").addEventListener("click",()=>toggleCoordSign(root.querySelector("#fBLng")));

    root.querySelector("#fBCancel").onclick = closeSheet;
    root.querySelector("#fBSave").onclick = async ()=>{
      const name = root.querySelector("#fBName").value.trim();
      if(!name){ toast(t("toast_ponle_nombre_bloque")); return; }
      const grade = selectedGrade;
      const blockNumber = parseInt(root.querySelector("#fBNumber").value,10) || null;
      const latVal = parseFloat(root.querySelector("#fBLat").value.replace(",","."));
      const lngVal = parseFloat(root.querySelector("#fBLng").value.replace(",","."));
      const blockLat = isNaN(latVal) ? null : latVal;
      const blockLng = isNaN(lngVal) ? null : lngVal;
      const comment = root.querySelector("#fBComment").value.trim();
      const styleTags = Array.from(selectedTags);
      const wasNotDone = !existing || existing.status !== "done";
      const justCompleted = status==="done" && wasNotDone;
      const finalPhotos = justCompleted ? [] : formPhotos;
      const finalFavorite = status==="done" ? false : (selectedPriority==="super");
      const finalPriority = status==="done" ? undefined : selectedPriority;
      const finalDiscardReason = (status==="todo" && selectedPriority==="discarded") ? root.querySelector("#fBDiscardReason").value.trim() : undefined;
      const dateDoneInput = root.querySelector("#fBDateDone");
      const finalDateDone = status==="done" ? dateInputValueToTs(dateDoneInput?dateDoneInput.value:null) : undefined;
      let savedBlock;
      if(existing){
        const priorityChanged = getPriority(existing) !== (finalPriority||"normal");
        existing.name=name; existing.grade=grade; existing.status=status; existing.comment=comment;
        existing.blockNumber=blockNumber;
        existing.lat=blockLat; existing.lng=blockLng;
        existing.styleTags=styleTags; existing.rockType=selectedRock; existing.favorite=finalFavorite;
        existing.priority=finalPriority; existing.discardReason=finalDiscardReason;
        existing.rating = status==="done" ? rating : undefined;
        existing.attempts = status==="done" ? selectedAttempt : undefined;
        existing.photos = finalPhotos;
        existing.dateDone = finalDateDone;
        if(priorityChanged) existing.createdAt = Date.now();
        await dbPut("blocks", existing);
        savedBlock = existing;
      } else {
        savedBlock = {
          id:uid(), sectorId:sec.id, name, grade, status, comment, blockNumber,
          lat:blockLat, lng:blockLng,
          styleTags, rockType:selectedRock, photos: finalPhotos, favorite: finalFavorite,
          priority: finalPriority, discardReason: finalDiscardReason,
          rating: status==="done"?rating:undefined,
          attempts: status==="done"?selectedAttempt:undefined,
          dateDone: finalDateDone,
          createdAt: Date.now()
        };
        await dbPut("blocks", savedBlock);
      }
      if(status==="done" && wasNotDone){
        playSuccessChime();
      }
      closeSheet();
      state.blockFilter = status;
      render();
    };
  });
}

async function renderRoutesView(loc, sec){
  setHeader(sec.name, loc.name, true);
  fabBtn.style.display = "flex";
  fabBtn.onclick = ()=>openRouteForm(sec);

  const allRoutes = (await dbGetAll("routes")).filter(r=>r.sectorId===sec.id);
  allRoutes.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  const todoRoutes = allRoutes.filter(r=>r.status==="todo").sort((a,b)=>{
    const pr = priorityRank(a)-priorityRank(b);
    if(pr!==0) return pr;
    return (b.createdAt||0)-(a.createdAt||0);
  });
  const doneRoutes = allRoutes.filter(r=>r.status==="done").sort((a,b)=>{
    const fav = (b.favorite?1:0)-(a.favorite?1:0);
    if(fav!==0) return fav;
    return (b.dateDone||0)-(a.dateDone||0);
  });

  let html = locationGuideSectionHTML(sec);

  html += `<div class="section-title">${t("vias_en",escapeHtml(sec.name))}</div>`;

  html += `<div class="tabs-row">
    <button data-f="todo" class="${state.blockFilter==='todo'?'active':''}">${t("tab_por_hacer",todoRoutes.length)}</button>
    <button data-f="done" class="${state.blockFilter==='done'?'active':''}">${t("tab_hechos",doneRoutes.length)}</button>
  </div>`;

  const hasActiveFilters = state.itemSortMode!=="recent" || state.itemStyleFilter.size>0 || !!state.itemGradeMin || !!state.itemGradeMax;
  html += `<div class="search-filter-row">
    <div class="search-bar" style="margin:0;flex:1;"><span class="search-icon">${searchIconSVG(14)}</span><input type="search" id="itemSearchInput" placeholder="${t("buscar_vias_placeholder")}" value="${escapeAttr(state.itemSearchTerm)}"></div>
    <button class="icon-btn-search ${hasActiveFilters?'active':''}" id="itemFilterBtn" title="${t("filtros_titulo")}">${filterIconSVG(16)}</button>
  </div>`;
  html += `<div id="itemListArea"></div>`;

  mainArea.innerHTML = html;

  wireLocationGuideSection(sec);

  mainArea.querySelectorAll("[data-f]").forEach(el=>{
    el.addEventListener("click",()=>{ state.blockFilter = el.dataset.f; state.itemSearchTerm=""; render(); });
  });

  const listArea = document.getElementById("itemListArea");
  const fullList = state.blockFilter === "todo" ? todoRoutes : doneRoutes;

  function currentFilteredList(){
    const term = state.itemSearchTerm.trim().toLowerCase();
    let l = fullList;
    if(term) l = l.filter(r=>(r.name||"").toLowerCase().includes(term) || (r.grade||"").toLowerCase().includes(term));
    if(state.itemStyleFilter.size>0){
      l = l.filter(r=>(r.climbStyles||[]).some(tag=>state.itemStyleFilter.has(tag)));
    }
    if(state.itemGradeMin || state.itemGradeMax){
      const minR = state.itemGradeMin ? gradeRank(state.itemGradeMin) : -Infinity;
      const maxR = state.itemGradeMax ? gradeRank(state.itemGradeMax) : Infinity;
      l = l.filter(r=>{
        const rk = gradeRank(r.grade);
        return rk!==null && rk>=minR && rk<=maxR;
      });
    }
    if(state.itemSortMode==="best"){
      l = l.slice().sort((a,b)=>(b.rating||0)-(a.rating||0));
    } else if(state.itemSortMode==="worst"){
      l = l.slice().sort((a,b)=>(a.rating||0)-(b.rating||0));
    } else if(state.itemSortMode==="grade_asc"){
      l = l.slice().sort((a,b)=>(gradeRank(a.grade)??0)-(gradeRank(b.grade)??0));
    } else if(state.itemSortMode==="grade_desc"){
      l = l.slice().sort((a,b)=>(gradeRank(b.grade)??0)-(gradeRank(a.grade)??0));
    }
    return l;
  }

  function renderListBody(){
    const list = currentFilteredList();
    revokeActivePhotoUrls();
    let bodyHtml = "";
    if(list.length===0){
      bodyHtml = state.itemSearchTerm.trim()
        ? emptyState("🔍", t("busqueda_sin_resultados_t"), t("busqueda_sin_resultados_s"))
        : (state.blockFilter==="todo"
          ? emptyState("🎯", t("empty_pendiente_via_t"), t("empty_pendiente_via_s"))
          : emptyState("🏆", t("empty_hechos_via_t"), t("empty_hechos_via_s")));
    } else if(state.blockFilter==="todo" && state.itemSortMode==="recent"){
      let lastGroup = null;
      for(const r of list){
        const p = getPriority(r);
        const grp = p==="radar" ? "radar" : (p==="discarded" ? "discarded" : "main");
        if(grp !== lastGroup && grp !== "main"){
          if(grp==="discarded") bodyHtml += `<div class="section-title">${t("sec_descartados")}</div>`;
        }
        lastGroup = grp;
        bodyHtml += renderRouteRow(r);
      }
    } else {
      for(const r of list){
        bodyHtml += renderRouteRow(r);
      }
    }
    listArea.innerHTML = bodyHtml;
    wireListBody(list);
  }

  function wireListBody(list){
    listArea.querySelectorAll("[data-route]").forEach(el=>{
      el.addEventListener("click",(e)=>{
        if(e.target.closest("[data-action], textarea, input, label")) return;
        const expand = el.querySelector(".block-expand");
        const wasOpen = expand.classList.contains("open");
        listArea.querySelectorAll(".block-expand.open").forEach(x=>x.classList.remove("open"));
        listArea.querySelectorAll("[data-route].expanded").forEach(x=>x.classList.remove("expanded"));
        if(!wasOpen){ expand.classList.add("open"); el.classList.add("expanded"); }
      });
    });

    listArea.querySelectorAll("[data-action=complete-route]").forEach(el=>{
      el.addEventListener("click",(e)=>{
        e.stopPropagation();
        const route = list.find(r=>r.id===el.dataset.route);
        openRouteCompleteForm(route);
      });
    });
    listArea.querySelectorAll("[data-action=abandon-route]").forEach(el=>{
      el.addEventListener("click",(e)=>{
        e.stopPropagation();
        const route = list.find(r=>r.id===el.dataset.route);
        openRouteAbandonForm(route);
      });
    });
    listArea.querySelectorAll("[data-action=priority-normal-route]").forEach(el=>{
      el.addEventListener("click", async (e)=>{
        e.stopPropagation();
        const route = list.find(r=>r.id===el.dataset.route);
        route.priority = "normal";
        route.favorite = false;
        route.createdAt = Date.now();
        await dbPut("routes", route);
        render();
      });
    });
    listArea.querySelectorAll("[data-action=priority-super-route]").forEach(el=>{
      el.addEventListener("click", async (e)=>{
        e.stopPropagation();
        const route = list.find(r=>r.id===el.dataset.route);
        const isActive = getPriority(route)==="super";
        route.priority = isActive ? "normal" : "super";
        route.favorite = !isActive;
        route.createdAt = Date.now();
        await dbPut("routes", route);
        if(!isActive) playSuperProjectChime();
        render();
      });
    });
    listArea.querySelectorAll("[data-action=priority-radar-route]").forEach(el=>{
      el.addEventListener("click", async (e)=>{
        e.stopPropagation();
        const route = list.find(r=>r.id===el.dataset.route);
        const isActive = getPriority(route)==="radar";
        route.priority = isActive ? "normal" : "radar";
        route.favorite = false;
        route.createdAt = Date.now();
        await dbPut("routes", route);
        if(!isActive) playRadarPing();
        render();
      });
    });
    listArea.querySelectorAll("[data-action=save-comment-route]").forEach(el=>{
      el.addEventListener("click", async (e)=>{
        e.stopPropagation();
        const route = list.find(r=>r.id===el.dataset.route);
        const ta = listArea.querySelector(`textarea[data-comment-for="${route.id}"]`);
        route.comment = ta.value.trim();
        await dbPut("routes", route);
        toast(t("toast_nota_guardada"));
        render();
      });
    });
    listArea.querySelectorAll("[data-action=toggle-favorite-route]").forEach(el=>{
      el.addEventListener("click", async (e)=>{
        e.stopPropagation();
        const route = list.find(r=>r.id===el.dataset.route);
        route.favorite = !route.favorite;
        await dbPut("routes", route);
        render();
      });
    });
    listArea.querySelectorAll("[data-action=edit-route]").forEach(el=>{
      el.addEventListener("click",(e)=>{
        e.stopPropagation();
        const route = list.find(r=>r.id===el.dataset.route);
        openRouteForm(sec, route);
      });
    });
    listArea.querySelectorAll("[data-action=delete-route]").forEach(el=>{
      el.addEventListener("click", async (e)=>{
        e.stopPropagation();
        if(!confirm(t("confirm_del_bloque"))) return;
        await dbDelete("routes", el.dataset.route);
        toast(t("toast_bloque_eliminado"));
        render();
      });
    });
    listArea.querySelectorAll("[data-action=add-photo-route]").forEach(el=>{
      el.addEventListener("click",(e)=>{
        e.stopPropagation();
        pendingPhotoRouteId = el.dataset.route;
      });
    });
    listArea.querySelectorAll("[data-photo-view-route]").forEach(el=>{
      el.addEventListener("click",(e)=>{
        e.stopPropagation();
        const route = list.find(r=>r.id===el.dataset.route);
        if(route) openPhotoLightbox(route, el.dataset.photoViewRoute, "routes");
      });
    });
  }

  renderListBody();

  document.getElementById("itemSearchInput").addEventListener("input",(e)=>{
    state.itemSearchTerm = e.target.value;
    renderListBody();
  });

  document.getElementById("itemFilterBtn").addEventListener("click",()=>{
    openItemFilterSheet(ROUTE_CLIMB_STYLES, ROUTE_GRADES, ()=>{
      const btn = document.getElementById("itemFilterBtn");
      if(btn) btn.classList.toggle("active", state.itemSortMode!=="recent" || state.itemStyleFilter.size>0 || !!state.itemGradeMin || !!state.itemGradeMax);
      renderListBody();
    });
  });
}

function renderRouteRow(r){
  const isDone = r.status === "done";
  const gradeTxt = r.grade ? escapeHtml(displayGrade(r.grade)) : "?";
  const priority = getPriority(r);
  const isDiscarded = !isDone && priority==="discarded";
  let topCornerHtml = "";
  let priorityBadgeHtml = "";
  if(isDone){
    if(r.dateDone) topCornerHtml = `<div class="card-corner"><span class="done-date">${formatDoneDate(r.dateDone)}</span></div>`;
  } else if(priority==="super"){
    priorityBadgeHtml = `<div class="card-corner"><div class="super-project-badge">${t("super_proyecto_on")}</div></div>`;
  } else if(priority==="radar"){
    priorityBadgeHtml = `<div class="card-corner"><div class="radar-badge">${t("radar_badge")}</div></div>`;
  } else if(priority==="discarded"){
    priorityBadgeHtml = `<div class="card-corner"><div class="discarded-badge">${t("descartado_badge")}</div></div>`;
  } else {
    priorityBadgeHtml = `<div class="card-corner"><span class="proyecto-plain-label">${t("proyecto_badge")}</span></div>`;
  }
  let noteHtml = "";
  if(isDiscarded && r.discardReason){
    noteHtml = `<div class="bsub bsub-truncate">🗑️ ${escapeHtml(r.discardReason)}</div>`;
  } else if(!isDone && r.comment){
    noteHtml = `<div class="bsub bsub-truncate">${escapeHtml(r.comment)}</div>`;
  }
  let detailRows = "";
  if(isDone && r.comment){
    detailRows += `<div class="review-line"><strong>${t("resena_label")}:</strong> ${escapeHtml(r.comment)}</div>`;
  }
  if((r.climbStyles||[]).length) detailRows += `<div class="block-detail-row"><span class="block-detail-label">${t("estilo_escalada")}</span><span class="block-detail-value">${(r.climbStyles||[]).map(cs=>escapeHtml(cs)).join(", ")}</span></div>`;
  if(r.rockType) detailRows += `<div class="block-detail-row"><span class="block-detail-label">${t("tipo_roca")}</span><span class="block-detail-value">${escapeHtml(r.rockType)}</span></div>`;
  if(r.length) detailRows += `<div class="block-detail-row"><span class="block-detail-label">${t("altura_via")}</span><span class="block-detail-value">${r.length} m</span></div>`;
  if(r.bolts) detailRows += `<div class="block-detail-row"><span class="block-detail-label">${t("num_seguros")}</span><span class="block-detail-value">${r.bolts}</span></div>`;
  if(r.numAttempts) detailRows += `<div class="block-detail-row"><span class="block-detail-label">${t("num_pegues")}</span><span class="block-detail-value">${r.numAttempts}</span></div>`;
  if(isDone && r.style) detailRows += `<div class="block-detail-row"><span class="block-detail-label">${t("estilo_encadene")}</span><span class="block-detail-value">${routeStyleLabel(r.style)}</span></div>`;
  if(isDone && r.sessions) detailRows += `<div class="block-detail-row"><span class="block-detail-label">${t("num_sesiones")}</span><span class="block-detail-value">${r.sessions}</span></div>`;
  if(isDone && r.dateDone) detailRows += `<div class="block-detail-row"><span class="block-detail-label">${t("fecha_encadene")}</span><span class="block-detail-value">${formatDoneDate(r.dateDone)}</span></div>`;
  if(r.lat!=null && r.lng!=null) detailRows += `<div class="block-detail-row"><span class="block-detail-label">📍 ${t("coordenadas_bloque_label")}</span><button class="block-detail-value" data-open-maps-lat="${r.lat}" data-open-maps-lng="${r.lng}" style="background:none;border:none;padding:0;font:inherit;color:var(--rust-600); text-decoration:none;cursor:pointer;">${t("btn_como_llegar_corto")}</button></div>`;
  const priorityCardClass = !isDone ? (priority!=="normal" ? `priority-${priority}-bg` : "priority-normal-flat") : "";
  return `<div class="list-item ${priorityCardClass}" data-route="${r.id}">
    <div class="card-header-wrap ${isDiscarded?"discarded-fade":""}">
      ${topCornerHtml}${priorityBadgeHtml}
      <div class="block-row">
        <div class="badge ${gradeColorClass(r.grade)} mono">${gradeTxt}</div>
        <div class="block-info">
          <div class="bname">${escapeHtml(r.name)}${(isDone && r.favorite) ? `<span class="favorite-star" aria-hidden="true">★</span>` : ""}</div>
          ${(isDone && r.rating) ? `<div class="rating-under-name">${ratingBadgeHTML(r.rating)}</div>` : ""}
          ${noteHtml}
        </div>
      </div>
    </div>
    <div class="block-expand">
      ${detailRows?`<div class="block-detail-rows">${detailRows}</div>`:""}
      ${isDone ? `` : `
        <div class="btn-row">
          <button class="btn btn-xs btn-success" style="flex:1;" data-action="complete-route" data-route="${r.id}">${t("btn_conseguido")}</button>
          <button class="btn btn-xs btn-ghost ${priority==='super'?'btn-priority-active-super':''}" data-action="priority-super-route" data-route="${r.id}">${t("super_proyecto_on")}</button>
        </div>
        <div class="btn-row">
          <button class="btn btn-xs btn-ghost ${priority==='normal'?'btn-priority-active-normal':''}" data-action="priority-normal-route" data-route="${r.id}">${t("proyecto_badge")}</button>
          <button class="btn btn-xs btn-ghost ${priority==='radar'?'btn-priority-active-radar':''}" data-action="priority-radar-route" data-route="${r.id}">${t("radar_badge")}</button>
          <button class="btn btn-xs btn-ghost ${priority==='discarded'?'btn-priority-active-discarded':''}" data-action="abandon-route" data-route="${r.id}">🗑️ ${t("btn_abandono")}</button>
        </div>
        <label class="field-label">${t("que_falto_opcional")}</label>
        <textarea data-comment-for="${r.id}" placeholder="${t("ph_notas")}">${escapeHtml(r.comment||"")}</textarea>
        <div class="btn-row">
          <button class="btn btn-ghost" data-action="save-comment-route" data-route="${r.id}">${t("btn_guardar_nota")}</button>
        </div>
        <label class="field-label">${t("fotos")}</label>
        <div class="photos-hint">${t("fotos_hint")}</div>
        <div class="block-photos">
          ${(r.photos||[]).filter(p=>p&&(p.blob||p.dataUrl)).map(p=>`<div class="photo-thumb" data-photo-view-route="${p.id}" data-route="${r.id}"><img src="${photoUrl(p)}" alt=""></div>`).join("")}
          <label class="photo-add-btn" data-action="add-photo-route" data-route="${r.id}" for="routePhotoInput">+</label>
        </div>
      `}
      <div class="secondary-actions-row">
        ${isDone?`<button class="btn-text ${r.favorite?'active-fav':''}" data-action="toggle-favorite-route" data-route="${r.id}">${r.favorite?t("favorite_on"):t("favorite_add")}</button>`:""}
        <button class="btn-text" data-action="edit-route" data-route="${r.id}">${t("btn_editar")}</button>
        <button class="btn-text danger" data-action="delete-route" data-route="${r.id}">${t("btn_eliminar")}</button>
      </div>
    </div>
  </div>`;
}

function openRouteForm(sec, existing){
  const grades = ROUTE_GRADES;
  const initialGrade = (existing && existing.grade && grades.includes(existing.grade)) ? existing.grade : (grades.includes("4+") ? "4+" : (grades.includes("VB") ? "VB" : grades[0]));
  const customClimbStyles = existing ? (existing.climbStyles||[]).filter(cs=>!ROUTE_CLIMB_STYLES.includes(cs)) : [];
  const customRouteRockType = (existing && existing.rockType && !ROUTE_ROCK_TYPES.includes(existing.rockType)) ? existing.rockType : null;
  openSheet(`
    <h2>${t("route_form_title",!!existing)}</h2>
    <div class="sheet-sub">${t("sec_en",escapeHtml(sec.name))}</div>
    <label class="field-label">${t("route_name")}</label>
    <input type="text" id="rName" value="${existing?escapeAttr(existing.name):""}" placeholder="${t("ph_nombre_bloque")}">
    <label class="field-label">${t("grado")}</label>

      const justCompleted = status==="done" && wasNotDone;
      const finalPhotos = justCompleted ? [] : formPhotos;
      const finalFavorite = status==="done" ? false : (selectedPriority==="super");
      const finalPriority = status==="done" ? undefined : selectedPriority;
      const finalDiscardReason = (status==="todo" && selectedPriority==="discarded") ? root.querySelector("#rDiscardReason").value.trim() : undefined;
      const dateDoneInput = root.querySelector("#rDateDone");
      const finalDateDone = status==="done" ? dateInputValueToTs(dateDoneInput?dateDoneInput.value:null) : undefined;
      let savedRoute;
      if(existing){
        const priorityChanged = getPriority(existing) !== (finalPriority||"normal");
        existing.name=name; existing.grade=grade; existing.status=status; existing.comment=comment;
        existing.lat=routeLat; existing.lng=routeLng;
        existing.rockType=selectedRockType; existing.climbStyles=climbStyles;
        existing.length=length; existing.bolts=bolts; existing.numAttempts=numAttempts; existing.favorite=finalFavorite;
        existing.priority=finalPriority; existing.discardReason=finalDiscardReason;
        existing.rating = status==="done" ? rating : undefined;
        existing.style = status==="done" ? selectedStyle : undefined;
        existing.photos = finalPhotos;
        existing.dateDone = finalDateDone;
        if(priorityChanged) existing.createdAt = Date.now();
        await dbPut("routes", existing);
        savedRoute = existing;
      } else {
        savedRoute = {
          id:uid(), sectorId:sec.id, name, grade, status, comment,
          lat:routeLat, lng:routeLng,
          rockType:selectedRockType, climbStyles, length, bolts, numAttempts, photos: finalPhotos, favorite: finalFavorite,
          priority: finalPriority, discardReason: finalDiscardReason,
          rating: status==="done"?rating:undefined,
          style: status==="done"?selectedStyle:undefined,
          dateDone: finalDateDone,
          createdAt: Date.now()
        };
        await dbPut("routes", savedRoute);
      }
      if(status==="done" && wasNotDone){
        playSuccessChime();
      }
      closeSheet();
      state.blockFilter = status;
      render();
    };
  });

let pendingPhotoRouteId = null;

let activePhotoUrls = [];
function revokeActivePhotoUrls(){
  activePhotoUrls.forEach(u=>URL.revokeObjectURL(u));
  activePhotoUrls = [];
}
function fileToDataUrl(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.onerror = ()=>reject(reader.error);
    reader.readAsDataURL(file);
  });
}
function compressImageToDataUrl(file, maxDim, quality){
  maxDim = maxDim || 1600; quality = quality || 0.82;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.naturalWidth, h = img.naturalHeight;
        if(!w || !h){ resolve(e.target.result); return; }
        if(w > maxDim || h > maxDim){
          if(w > h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        try{
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL("image/jpeg", quality));
        }catch(err){
          resolve(e.target.result);
        }
      };
      img.onerror = ()=>resolve(e.target.result);
      img.src = e.target.result;
    };
    reader.onerror = ()=>reject(reader.error);
    reader.readAsDataURL(file);
  });
}
function photoUrl(p){
  if(p.dataUrl) return p.dataUrl;
  const url = URL.createObjectURL(p.blob);
  activePhotoUrls.push(url);
  return url;
}

let lightboxContext = null;
function openPhotoLightbox(block, photoId, storeName){
  const photos = (block.photos||[]).filter(p=>p&&(p.blob||p.dataUrl));
  const idx = photos.findIndex(p=>p.id===photoId);
  if(idx===-1) return;
  lightboxContext = {block, photos, index: idx, storeName: storeName||"blocks"};
  paintLightbox();
  document.getElementById("photoLightbox").classList.add("open");
}
function paintLightbox(){
  if(!lightboxContext) return;
  const {photos, index} = lightboxContext;
  document.getElementById("photoLightboxImg").src = photoUrl(photos[index]);
  const counter = document.getElementById("photoLightboxCounter");
  counter.textContent = photos.length>1 ? `${index+1} / ${photos.length}` : "";
  document.getElementById("photoLightboxPrev").style.display = photos.length>1 ? "" : "none";
  document.getElementById("photoLightboxNext").style.display = photos.length>1 ? "" : "none";
}
function closePhotoLightbox(){
  document.getElementById("photoLightbox").classList.remove("open");
  document.getElementById("photoLightboxImg").src = "";
  lightboxContext = null;
}
document.getElementById("photoLightboxClose").addEventListener("click", closePhotoLightbox);
document.getElementById("photoLightboxPrev").addEventListener("click", ()=>{
  if(!lightboxContext) return;
  const {photos} = lightboxContext;
  lightboxContext.index = (lightboxContext.index - 1 + photos.length) % photos.length;
  paintLightbox();
});
document.getElementById("photoLightboxNext").addEventListener("click", ()=>{
  if(!lightboxContext) return;
  const {photos} = lightboxContext;
  lightboxContext.index = (lightboxContext.index + 1) % photos.length;
  paintLightbox();
});
document.getElementById("photoLightboxDelete").addEventListener("click", async ()=>{
  if(!lightboxContext) return;
  if(!confirm(t("confirm_del_foto"))) return;
  const {block, photos, index, storeName} = lightboxContext;
  const photoId = photos[index].id;
  block.photos = (block.photos||[]).filter(p=>p.id!==photoId);
  await dbPut(storeName||"blocks", block);
  toast(t("toast_foto_eliminada"));
  const remaining = block.photos.filter(p=>p&&(p.blob||p.dataUrl));
  if(remaining.length===0){
    closePhotoLightbox();
  } else {
    lightboxContext.photos = remaining;
    lightboxContext.index = Math.min(index, remaining.length-1);
    paintLightbox();
  }
  render();
});

let currentPdfUrl = null;

let _pdfjsLoadPromise = null;
function ensurePdfJs(){
  if(window.pdfjsLib) return Promise.resolve();
  if(_pdfjsLoadPromise) return _pdfjsLoadPromise;
  _pdfjsLoadPromise = new Promise((resolve, reject)=>{
    const script = document.createElement("script");
    script.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    script.onload = ()=>{
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      resolve();
    };
    script.onerror = ()=>{ _pdfjsLoadPromise = null; reject(new Error("pdfjs load failed")); };
    document.head.appendChild(script);
  });
  return _pdfjsLoadPromise;
}
async function openPdfOverlay(url, filename){
  const existingOverlay = document.getElementById("pdfOverlay");
  if(existingOverlay) existingOverlay.remove();
  const overlay = document.createElement("div");
  overlay.className = "pdf-overlay";
  overlay.id = "pdfOverlay";
  overlay.innerHTML = `
    <button class="pdf-overlay-close" id="pdfOverlayClose">✕</button>
    <div class="pdf-page-indicator" id="pdfPageIndicator" style="display:none;"></div>
    <div class="pdf-pager" id="pdfPager"><div class="pdf-overlay-loading">${t("cargando_pdf")}</div></div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelector("#pdfOverlayClose").addEventListener("click", closePdfOverlay);
  document.body.style.overflow = "hidden";
  history.pushState({pdfOverlay:true}, "");
  window.addEventListener("popstate", handlePdfOverlayPopstate);

  const pager = document.getElementById("pdfPager");
  const indicator = document.getElementById("pdfPageIndicator");
  try{
    await ensurePdfJs();
    const pdf = await window.pdfjsLib.getDocument(url).promise;
    pager.innerHTML = "";
    const dpr = window.devicePixelRatio || 1;
    const targetCssWidth = pager.clientWidth || window.innerWidth;
    const pageTops = [];
    for(let i=1;i<=pdf.numPages;i++){
      const page = await pdf.getPage(i);
      const baseViewport = page.getViewport({scale:1});
      const cssScale = targetCssWidth / baseViewport.width;
      const renderViewport = page.getViewport({scale: cssScale * dpr});
      const canvas = document.createElement("canvas");
      canvas.className = "pdf-page-canvas";
      canvas.width = renderViewport.width;
      canvas.height = renderViewport.height;
      canvas.style.width = targetCssWidth + "px";
      canvas.style.height = (renderViewport.height / dpr) + "px";

      const slide = document.createElement("div");
      slide.className = "pdf-page-slide";
      slide.appendChild(canvas);
      pager.appendChild(slide);
      pageTops.push(slide.offsetTop);

      await page.render({canvasContext:canvas.getContext("2d"), viewport:renderViewport}).promise;
    }
    if(pdf.numPages>1){
      indicator.style.display = "";
      indicator.textContent = `1 / ${pdf.numPages}`;
      pager.addEventListener("scroll", ()=>{
        const y = pager.scrollTop + pager.clientHeight*0.3;
        let idx = 1;
        for(let i=0;i<pageTops.length;i++){ if(y>=pageTops[i]) idx = i+1; }
        indicator.textContent = `${idx} / ${pdf.numPages}`;
      });
    }
  }catch(err){
    console.error("PDF render error:", err);
    pager.innerHTML = `<div class="pdf-overlay-error">${t("pdf_no_disponible")}</div>`;
  }
}
function closePdfOverlay(){
  if(history.state && history.state.pdfOverlay){
    history.back();
  } else {
    closePdfOverlayInternal();
  }
}
function handlePdfOverlayPopstate(){
  closePdfOverlayInternal();
}
function closePdfOverlayInternal(){
  window.removeEventListener("popstate", handlePdfOverlayPopstate);
  const overlay = document.getElementById("pdfOverlay");
  if(overlay) overlay.remove();
  document.body.style.overflow = "";
  if(currentPdfUrl){ URL.revokeObjectURL(currentPdfUrl); currentPdfUrl = null; }
}
function openGuideViewer(record, storeName){
  const guide = record.guide;
  if(!guide || !guide.blob) return;
  if(currentPdfUrl){ URL.revokeObjectURL(currentPdfUrl); currentPdfUrl = null; }
  currentPdfUrl = URL.createObjectURL(guide.blob);
  openPdfOverlay(currentPdfUrl, guide.filename);
}

    .filter(l=>{ if(seenIds.has(l.id)) return false; seenIds.add(l.id); return true; })
    .sort((a,b)=>a.date.localeCompare(b.date))
    .slice(0,1);
  if(upcoming.length===0){
    return emptyState("🗓️", t("empty_proximas_t"), t("empty_proximas_s"));
  }
  const dayNames = dayNamesFull();
  let html = `<div class="upcoming-list">`;

    const d = new Date(l.date+"T00:00:00");

    html += `<div class="upcoming-card ${isToday?"is-today":""} ${isCompleted?"is-finished":""}" style="${isToday?"":`background:${sessionColorLight(l.color||"slate")};border-left-color:${sessionColorHex(l.color||"slate")};`}" data-upcoming-log="${l.id}">

      </div>
      <div class="upcoming-body">
        <div class="upcoming-title ${isCompleted?"finished":""}">${escapeHtml(l.title||t("sesion_generica"))}${isToday&&!isCompleted?` <span class="today-tag">${t("hoy_tag")}</span>`:''}${isCompleted?` <span class="finished-tag">✓ ${t("sesion_completada")}</span>`:''}</div>

function computeWeeklySessionCounts(logs, weeks){
  weeks = weeks || 8;
  const now = new Date();
  const start = new Date(now);
  const dow = (now.getDay()+6)%7;
  start.setDate(now.getDate()-dow);
  start.setHours(0,0,0,0);
  if(logs.length>0){
    const earliestDate = logs.reduce((min,l)=>{
      if(!l.date) return min;
      return (!min || l.date<min) ? l.date : min;
    }, null);
    if(earliestDate){
      const earliestD = new Date(earliestDate+"T00:00:00");
      const weeksSinceEarliest = Math.floor((start-earliestD)/(7*24*60*60*1000)) + 1;
      weeks = Math.max(1, Math.min(weeks, weeksSinceEarliest));
    }
  }
  const result = [];
  for(let i=weeks-1;i>=0;i--){
    const wStart = new Date(start); wStart.setDate(start.getDate()-i*7);
    const wEnd = new Date(wStart); wEnd.setDate(wStart.getDate()+7);
    const count = logs.filter(l=>{
      if(!l.date) return false;
      const d = new Date(l.date+"T00:00:00");
      return d >= wStart && d < wEnd;
    }).length;
    result.push({label:`${wStart.getDate()}/${wStart.getMonth()+1}`, count});
  }
  return result;
}

/* ---- Sonidos ---- */
let _audioCtx = null;
function getAudioCtx(){
  if(!_audioCtx){
    const Ctx = window.AudioContext || window.webkitAudioContext;
    _audioCtx = new Ctx();
  }
  if(_audioCtx.state === "suspended"){
    _audioCtx.resume().catch(()=>{});
  }
  return _audioCtx;
}
function playTone(freq, dur, delay, vol){
  try{
    const ctx = getAudioCtx();
    const t0 = ctx.currentTime + (delay||0);
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "sine";
    o.frequency.value = freq;
    o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol||0.2, t0+0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t0+dur);
    o.start(t0);
    o.stop(t0+dur+0.03);
  }catch(e){}
}
function playBeep(){ playTone(880, 0.28); if(navigator.vibrate) navigator.vibrate(150); }
function playTick(){ playTone(1200, 0.13, 0); if(navigator.vibrate) navigator.vibrate(90); }

/* ---- Bloqueo de pantalla mientras hay un temporizador activo ---- */
let wakeLockSentinel = null;
async function acquireWakeLock(){
  try{
    if("wakeLock" in navigator){
      wakeLockSentinel = await navigator.wakeLock.request("screen");
    }
  }catch(e){ wakeLockSentinel = null; }
}
function releaseWakeLock(){
  if(wakeLockSentinel){ wakeLockSentinel.release().catch(()=>{}); wakeLockSentinel = null; }
}
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState==="visible" && (timerState.running || restBurnState.running)){
    acquireWakeLock();
  }
});

/* ---- Cronómetro (temporizador de intervalos) ---- */
const timerState = {
  phase:"idle", stageIndex:0,
  stages:[{edgeMm:null, workSec:10, restSec:5, rounds:6}],
  stageRests:[], round:0, remaining:0, running:false
};
let timerHandle = null;

function formatSec(s){
  s = Math.max(0, Math.round(s));
  const m = Math.floor(s/60), sec = s%60;
  return m>0 ? `${m}:${String(sec).padStart(2,"0")}` : `${sec}`;
}

function vibrateDevice(){ if(navigator.vibrate) navigator.vibrate(200); }

function playHornTone(freq, dur, delay, vol){
  try{
    const ctx = getAudioCtx();
    const t0 = ctx.currentTime + (delay||0);
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "sawtooth";
    o.frequency.value = freq;
    o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol||0.4, t0+0.03);
    g.gain.exponentialRampToValueAtTime(0.001, t0+dur);
    o.start(t0);
    o.stop(t0+dur+0.05);
  }catch(e){}
}
function playHornStart(){
  playTone(1900, 0.55, 0, 0.7);
  if(navigator.vibrate) navigator.vibrate(220);
}
function playHornEnd(){
  playHornTone(340, 0.45, 0, 0.55);
  playHornTone(260, 0.6, 0.4, 0.55);
  if(navigator.vibrate) navigator.vibrate([200,80,200,80,300]);
}
function playHornWorkEnd(){
  playHornTone(400, 0.5, 0, 0.5);
  if(navigator.vibrate) navigator.vibrate(180);
}
function playCountdownWarn(){ playTone(880, 0.15, 0, 0.3); }

function timerStart(){
  getAudioCtx();
  if(timerState.phase==="idle" || timerState.phase==="done"){
    timerState.phase = "ready";
    timerState.stageIndex = 0;
    timerState.round = 0;
    timerState.remaining = 5;
  }
  timerState.running = true;
  acquireWakeLock();
  clearInterval(timerHandle);
  timerHandle = setInterval(()=>{
    timerState.remaining -= 1;
    if(timerState.phase==="ready" && timerState.remaining>0 && timerState.remaining<=3){ playTick(); }
    if((timerState.phase==="rest"||timerState.phase==="stagerest") && timerState.remaining>0 && timerState.remaining<=3){ playCountdownWarn(); }
    if(timerState.remaining <= 0){
      if(timerState.phase==="ready"){
        timerState.phase = "work";
        timerState.round = 1;
        timerState.remaining = timerState.stages[timerState.stageIndex].workSec;
        playHornStart();
      } else if(timerState.phase==="work"){
        timerState.phase = "rest";
        timerState.remaining = timerState.stages[timerState.stageIndex].restSec;
        playHornWorkEnd();
      } else if(timerState.phase==="rest"){
        const stage = timerState.stages[timerState.stageIndex];
        if(timerState.round >= stage.rounds){
          if(timerState.stageIndex < timerState.stages.length-1){
            timerState.phase = "stagerest";
            timerState.remaining = timerState.stageRests[timerState.stageIndex] || 60;
            playBeep();
          } else {
            playHornEnd(); vibrateDevice();
            clearInterval(timerHandle);
            timerState.running = false;
            timerState.phase = "done";
            timerState.remaining = 0;
            releaseWakeLock();
            toast(t("serie_completa"));
            paintTimer();
            return;
          }
        } else {
          playHornStart();
          timerState.round += 1;
          timerState.phase = "work";
          timerState.remaining = stage.workSec;
        }
      } else if(timerState.phase==="stagerest"){
        timerState.stageIndex += 1;
        timerState.round = 1;
        timerState.phase = "work";
        timerState.remaining = timerState.stages[timerState.stageIndex].workSec;
        playHornStart();
      }
    }
    paintTimer();
  }, 1000);
  paintTimer();
}
function timerPause(){
  clearInterval(timerHandle);
  timerState.running = false;
  releaseWakeLock();
  paintTimer();
}
function timerReset(){
  clearInterval(timerHandle);
  timerState.phase = "idle";
  timerState.stageIndex = 0;
  timerState.round = 0;
  timerState.remaining = 0;
  timerState.running = false;
  releaseWakeLock();
}

function paintTimer(){
  const disp = document.getElementById("timerDisplay");
  if(!disp) return;
  const stage = timerState.stages[timerState.stageIndex] || timerState.stages[0];
  const phaseLabels = {ready:t("phase_ready"), work:t("phase_work"), rest:t("phase_rest"), stagerest:t("phase_stagerest"), done:t("phase_done"), idle:t("phase_idle")};
  document.getElementById("timerPhase").textContent = phaseLabels[timerState.phase];
  disp.textContent = timerState.phase==="idle" ? formatSec(stage.workSec) : formatSec(timerState.remaining);
  document.getElementById("timerRound").textContent = t("ronda", timerState.round||0, stage.rounds);
  const stageInfoEl = document.getElementById("timerStageInfo");
  if(stageInfoEl){
    if(timerState.stages.length>1){
      stageInfoEl.style.display = "";
      stageInfoEl.textContent = t("etapa_info", timerState.stageIndex+1, timerState.stages.length, stage.edgeMm);
    } else {
      stageInfoEl.style.display = "none";
    }
  }
  const startBtn = document.getElementById("tStart");
  if(startBtn) startBtn.textContent = timerState.running ? t("pausa") : (timerState.phase==="idle"||timerState.phase==="done" ? t("empezar_timer") : t("reanudar"));
  const card = document.getElementById("timerCard");
  if(card) card.className = "list-item timer-card phase-"+timerState.phase;
}

/* ---- Descanso entre pegues (temporizador simple independiente) ---- */
const restBurnState = { totalSec:180, remaining:180, running:false };
let restBurnHandle = null;

function restBurnStart(){
  if(restBurnState.remaining<=0) restBurnState.remaining = restBurnState.totalSec;
  restBurnState.running = true;
  acquireWakeLock();
  clearInterval(restBurnHandle);
  restBurnHandle = setInterval(()=>{
    restBurnState.remaining -= 1;
    if(restBurnState.remaining>0 && restBurnState.remaining<=3){ playTick(); }
    if(restBurnState.remaining<=0){
      clearInterval(restBurnHandle);
      restBurnState.running = false;
      playTimerDoneChime(); vibrateDevice();
      if(!timerState.running) releaseWakeLock();
      toast(t("toast_descanso_terminado"));
    }
    paintRestBurn();
  }, 1000);
  paintRestBurn();
}
function restBurnPause(){
  clearInterval(restBurnHandle);
  restBurnState.running = false;
  if(!timerState.running) releaseWakeLock();
  paintRestBurn();
}
function restBurnReset(){
  clearInterval(restBurnHandle);
  restBurnState.running = false;
  restBurnState.remaining = restBurnState.totalSec;
  if(!timerState.running) releaseWakeLock();
  paintRestBurn();
}
function paintRestBurn(){
  const disp = document.getElementById("restBurnDisplay");
  if(!disp) return;
  disp.textContent = formatSec(restBurnState.remaining);
  const startBtn = document.getElementById("rbStart");

  if(card) card.className = "list-item timer-card phase-rest";

}

      timerPause();
    } else {
      if(timerState.phase==="idle" || timerState.phase==="done"){
        const workSec = parseInt(document.getElementById("tWork").value,10) || 10;
        const restSec = parseInt(document.getElementById("tRest").value,10) || 5;
        const rounds = parseInt(document.getElementById("tRounds").value,10) || 6;
        timerState.stages = [{edgeMm: timerState.stages[0] ? timerState.stages[0].edgeMm : null, workSec, restSec, rounds}];
        timerState.stageRests = [];
        timerState.stageIndex = 0;
        timerState.phase = "idle";
      }
      timerStart();
    }
    render();
  };
  document.getElementById("tReset").onclick = ()=>{
    timerReset();
    render();
  };
  const addPresetBtn = document.getElementById("tAddPreset");
  if(addPresetBtn) addPresetBtn.addEventListener("click", ()=>openTimerPresetForm());
  document.querySelectorAll("[data-preset-view]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const p = (cachedTimerPresets||[]).find(x=>x.id===el.dataset.presetView);
      if(p) openTimerPresetDetail(p);
    });
  });
  document.getElementById("rbStart").onclick = ()=>{
    if(restBurnState.running){
      restBurnPause();
    } else {
      if(!restBurnState.running){
        const mins = parseFloat(document.getElementById("rbDuration").value) || 3;
        restBurnState.totalSec = Math.round(mins*60);
        if(restBurnState.remaining<=0 || restBurnState.remaining>restBurnState.totalSec) restBurnState.remaining = restBurnState.totalSec;
      }
      restBurnStart();
    }
  };
  document.getElementById("rbReset").onclick = ()=>{
    const mins = parseFloat(document.getElementById("rbDuration").value);
    restBurnState.totalSec = mins ? Math.round(mins*60) : restBurnState.totalSec;
    restBurnReset();
  };
  const rbDurationInput = document.getElementById("rbDuration");
  if(rbDurationInput){
    rbDurationInput.addEventListener("input", ()=>{
      if(restBurnState.running) return;
      const mins = parseFloat(rbDurationInput.value);
      if(!mins || mins<=0) return;
      restBurnState.totalSec = Math.round(mins*60);
      restBurnState.remaining = restBurnState.totalSec;
      paintRestBurn();
    });
  }
}

function renderCalendarGrid(monthDate, logs){
  const year = monthDate.getFullYear(), month = monthDate.getMonth();
  const first = new Date(year, month, 1);
  const startOffset = (first.getDay()+6)%7; // Monday=0
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const todayStr = new Date().toISOString().slice(0,10);

  const logsByDate = {};
  for(const l of logs){ if(l.date){ (logsByDate[l.date] = logsByDate[l.date]||[]).push(l); } }

  let html = `<div class="cal-header">
    <button id="calPrev">‹</button>
    <div class="cal-title">${monthNames()[month]} ${year}</div>
    <button id="calNext">›</button>
  </div>
  <div class="cal-grid">`;
  for(const d of dowLabels()) html += `<div class="cal-dow">${d}</div>`;
  for(let i=0;i<startOffset;i++) html += `<div class="cal-cell empty"></div>`;
  for(let day=1; day<=daysInMonth; day++){
    const dateStr = `${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
    const dayLogsList = logsByDate[dateStr];
    const hasLog = !!dayLogsList;
    const isToday = dateStr===todayStr;
    const cellColorKey = hasLog ? (dayLogsList[0].color||"slate") : null;
    const cellStyle = hasLog ? `background:${sessionColorLight(cellColorKey)};color:${sessionColorHex(cellColorKey)};` : "";
    html += `<div class="cal-cell ${hasLog?"has-log":""} ${isToday?"today":""}" style="${cellStyle}" data-cal-day="${dateStr}">
      ${day}
    </div>`;
  }
  html += `</div>`;
  return html;
}

function drawBarChart(canvas, buckets, barColor, height){
  const dpr = window.devicePixelRatio || 1;
  const cssW = canvas.clientWidth || 300;
  const cssH = height || 120;
  canvas.width = cssW*dpr; canvas.height = cssH*dpr;
  canvas.style.height = cssH+"px";
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,cssW,cssH);

  const topPad = 16;
  const bottomPad = 18;
  const max = Math.max(1, ...buckets.map(b=>b.count));
  const n = buckets.length;
  const slot = (cssW-16)/n;
  const barW = Math.min(26, slot*0.5);

  ctx.strokeStyle = "#D6D0C2";
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(8, cssH-bottomPad); ctx.lineTo(cssW-8, cssH-bottomPad); ctx.stroke();

  buckets.forEach((b,i)=>{
    const x = 8 + slot*i + (slot-barW)/2;
    const h = Math.max(2, (cssH-bottomPad-topPad) * (b.count/max));
    const y = cssH-bottomPad-h;
    ctx.fillStyle = barColor || "#55684A";
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(x,y,barW,h,[3,3,0,0]) : ctx.rect(x,y,barW,h);
    ctx.fill();
    ctx.fillStyle = "#211F1C";
    ctx.font = "700 9.5px -apple-system,sans-serif";
    ctx.textAlign = "center";
    if(b.count>0) ctx.fillText(String(b.count), x+barW/2, y-3);
    ctx.fillStyle = "#3A362F";
    ctx.font = "9px -apple-system,sans-serif";
    ctx.fillText(b.label, x+barW/2, cssH-5);
  });
  ctx.textAlign = "left";
}

const LEVEL_TIERS = [
  "Novato de la piedra","Aprendiz de boulder","Escalador de sector","Buscador de proyectos",
  "Fuerza de dedos","Especialista en placas","Domador del desplome","Maestro de la adherencia",
  "Veterano de la roca","Leyenda de sector","Mito del granito","Espíritu de la caliza",
  "Titán de los cantos","Guardián de la pared","Señor del boulder","Semidiós de la roca",
  "Deidad del boulder","Emperador de la piedra","Leyenda inmortal","Maestro supremo",
  "Leyenda absoluta del boulder"
];
const LEVEL_TIERS_EN = [
  "Stone novice","Boulder apprentice","Sector climber","Project seeker",
  "Finger strength","Slab specialist","Overhang tamer","Friction master",
  "Rock veteran","Sector legend","Granite myth","Limestone spirit",
  "Crimp titan","Wall guardian","Boulder lord","Rock demigod",
  "Boulder deity","Stone emperor","Immortal legend","Supreme master",
  "Absolute boulder legend"
];
const LEVELS_PER_TIER = 10;
const ROMAN_NUMERALS = ["I","II","III","IV","V","VI","VII","VIII","IX","X"];
function levelThreshold(L){
  if(L<=1) return 0;
  return Math.floor(50 * Math.pow(L-1, 1.9));
}
function levelName(L){
  const tiers = cachedSettings.language==="en" ? LEVEL_TIERS_EN : LEVEL_TIERS;
  const tierIdx = Math.min(Math.floor((L-1)/LEVELS_PER_TIER), tiers.length-1);
  const tierName = tiers[tierIdx];
  if(tierIdx === tiers.length-1){
    return `${tierName} (${t("nivel_abrev")} ${L})`;
  }
  const subLevel = ((L-1) % LEVELS_PER_TIER) + 1;
  return `${tierName} ${ROMAN_NUMERALS[subLevel-1]}`;
}
function gradeToPoints(grade){
  if(!grade) return 4;
  const gUpper = grade.trim().toUpperCase();
  if(VSCALE_APPROX_RANK.hasOwnProperty(gUpper)){
    const n = VSCALE_APPROX_RANK[gUpper] / 6;
    return Math.round(n*n);
  }
  const m = grade.trim().toLowerCase().match(/^(\d+)([abc])?(\+)?$/);
  if(!m){
    const m2 = grade.match(/\d+/);
    const n2 = m2 ? parseInt(m2[0],10) : 3;
    return n2*n2;
  }
  const n = parseInt(m[1],10);
  const letter = m[2];
  const plus = !!m[3];
  if(!letter) return n*n;
  const letterBase = {a:0,b:2,c:4}[letter];
  const subIndex = letterBase + (plus?1:0); // 0 (a) .. 5 (c+)
  const bonus = subIndex/8; // hasta +62.5% dentro del mismo número
  return Math.round(n*n*(1+bonus));
}
function computeLevel(points){
  let L = 1;
  while(levelThreshold(L+1) <= points) L++;
  const current = {min: levelThreshold(L), name: levelName(L)};
  const next = {min: levelThreshold(L+1), name: levelName(L+1)};
  return {current, next, index: L};
}

async function computeCurrentLevel(){
  const [blocks, routes, sectors] = await Promise.all([dbGetAll("blocks"), dbGetAll("routes"), dbGetAll("sectors")]);
  const doneBlocks = blocks.filter(b=>b.status==="done");
  const todoBlocks = blocks.filter(b=>b.status==="todo");
  const doneRoutes = routes.filter(r=>r.status==="done");
  const todoRoutes = routes.filter(r=>r.status==="todo");
  const doneAll = [...doneBlocks, ...doneRoutes];
  const todoAll = [...todoBlocks, ...todoRoutes];
  const achievements = computeAchievementsFor(doneAll, doneBlocks, doneRoutes, todoAll, sectors);
  const achievementBonus = achievements.filter(a=>a.current>=a.target).reduce((s,a)=>s+a.points,0);
  function itemPoints(item, isBoulder){
    const base = gradeToPoints(item.grade);
    const isFlash = isBoulder ? item.attempts==="flash" : (item.style==="flash"||item.style==="onsight");
    return isFlash ? Math.round(base*1.5) : base;
  }
  const basePoints = doneBlocks.reduce((s,b)=>s+itemPoints(b,true),0) + doneRoutes.reduce((s,r)=>s+itemPoints(r,false),0);
  const totalPoints = basePoints + Math.round(achievementBonus*0.4);
  return computeLevel(totalPoints);
}
